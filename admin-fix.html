<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0f0f1a; --card:#1a1a2e; --card2:#16213e;
    --primary:#5c3df4; --primary-dark:#4528d4;
    --accent:#a78bfa; --accent-gold:#f59e0b; --text:#e2e8f0; --muted:#94a3b8;
    --border:#2d2d44; --input-bg:#1e1e38;
    --success:#16a34a; --error:#dc2626; --warn:#d97706;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;}

  .header{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid var(--border);text-align:center;}
  .header h1{font-size:1.3rem;font-weight:800;color:var(--accent);}
  .header p{font-size:0.8rem;color:var(--muted);margin-top:4px;}

  .search-box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid var(--border);}
  .search-box input{width:100%;height:50px;background:var(--input-bg);border:2px solid var(--border);border-radius:12px;padding:0 14px;font-family:inherit;font-size:0.95rem;color:var(--text);outline:none;}
  .search-box input:focus{border-color:var(--primary);}
  .search-box button{width:100%;height:48px;background:var(--primary);color:#fff;font-family:inherit;font-size:0.9rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;margin-top:10px;}

  .user-card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--border);display:none;}
  .user-card.show{display:block;}
  .user-card h2{font-size:1.1rem;font-weight:800;margin-bottom:4px;color:var(--accent);}
  .user-card .email{font-size:0.78rem;color:var(--muted);margin-bottom:12px;}

  .wallet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .wallet-item{background:var(--card2);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border);}
  .wallet-item .wl{font-size:0.6rem;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
  .wallet-item .wa{font-size:1rem;font-weight:800;}
  .wallet-item .wa.bad{color:var(--error);}

  .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.82rem;}
  .info-row .l{color:var(--muted);}.info-row .v{font-weight:700;}

  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .btn{height:44px;border:none;border-radius:10px;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer;color:#fff;}
  .btn.fix{background:var(--warn);}
  .btn.credit{background:var(--success);}
  .btn.danger{background:var(--error);}

  .section-title{font-size:0.85rem;font-weight:700;margin:14px 0 8px;color:var(--accent);}

  .invest-card{background:var(--card2);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid var(--border);}
  .invest-card .ih{display:flex;justify-content:space-between;font-size:0.85rem;font-weight:700;margin-bottom:8px;}
  .invest-card .id{font-size:0.75rem;color:var(--muted);margin-bottom:3px;}
  .invest-card .id span{color:var(--text);font-weight:600;}
  .invest-card .id .red{color:var(--error);}
  .invest-card .id .green{color:var(--success);}
  .invest-card .credit-btn{width:100%;height:36px;background:var(--success);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:0.78rem;font-weight:700;cursor:pointer;margin-top:8px;}

  .result-box{background:var(--card2);border-radius:12px;padding:14px;margin-top:10px;text-align:center;font-size:0.85rem;font-weight:700;display:none;}
  .result-box.show{display:block;}
  .result-box.ok{background:#064e3b;color:#6ee7b7;border:1px solid #065f46;}
  .result-box.err{background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b;}

  .spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{text-align:center;padding:20px;color:var(--muted);display:none;}
  .loading-text.show{display:block;}
  .loading-text .spinner{display:block;margin-bottom:8px;}

  .credit-form{background:var(--card2);border-radius:12px;padding:14px;margin-top:10px;display:none;border:1px solid var(--accent);}
  .credit-form.show{display:block;}
  .credit-form input{width:100%;height:44px;background:var(--input-bg);border:2px solid var(--border);border-radius:10px;padding:0 12px;font-family:inherit;font-size:0.9rem;color:var(--text);outline:none;margin-bottom:8px;}
  .credit-form input:focus{border-color:var(--primary);}
  .credit-form .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
</style>
</head>
<body>

<div class="header">
  <h1>🛡️ Nexa Admin Panel</h1>
  <p>Search users · Fix wallets · Calculate & Credit Missing ROI</p>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Enter user email to search...">
  <button onclick="searchUser()">🔍 Search User</button>
</div>

<div class="loading-text" id="loadingBox"><div class="spinner"></div>Searching...</div>

<div class="user-card" id="userCard">
  <h2 id="userName">—</h2>
  <p class="email" id="userEmail">—</p>
  
  <div class="wallet-grid">
    <div class="wallet-item"><div class="wl">💰 Deposit</div><div class="wa" id="uDepW">$0.00</div></div>
    <div class="wallet-item"><div class="wl">💸 Withdrawal</div><div class="wa" id="uWdW">$0.00</div></div>
    <div class="wallet-item"><div class="wl">💵 Naira</div><div class="wa" id="uNgW">₦0</div></div>
  </div>

  <div class="info-row"><span class="l">Total Balance</span><span class="v" id="uTotal">$0.00</span></div>
  <div class="info-row"><span class="l">Referral Code</span><span class="v" id="uRef">—</span></div>
  <div class="info-row"><span class="l">Joined</span><span class="v" id="uJoined">—</span></div>

  <div class="btn-row">
    <button class="btn fix" onclick="fixWallet()">🔧 Fix NaN Wallet</button>
    <button class="btn credit" onclick="creditAllMissingROI()">💸 Credit ALL Missing ROI</button>
  </div>

  <p class="section-title">📊 Investments & ROI Calculation</p>
  <p style="font-size:0.7rem;color:var(--muted);margin-bottom:8px;">Calculated from investment start date to today (weekdays only)</p>
  <div id="investList">—</div>
  <div style="text-align:center;font-weight:700;margin-top:10px;font-size:0.9rem;" id="totalMissing"></div>

  <div class="result-box" id="resultBox"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const fc = { apiKey:"AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain:"nexa-a8cad.firebaseapp.com", projectId:"nexa-a8cad", storageBucket:"nexa-a8cad.firebasestorage.app", messagingSenderId:"324559998149", appId:"1:324559998149:web:e23ddfa3f0c71114eab4ac" };
  const app = initializeApp(fc);
  const db = getFirestore(app);

  let foundUserId = null;
  let foundUserData = null;
  let investmentsList = [];
  let totalMissingROI = 0;

  const ff = n => Math.round(n||0).toLocaleString();
  const fu = n => { if (isNaN(n) || n === null || n === undefined) return 'NaN'; return Number(n).toFixed(2); };

  function getTimestampMs(ts) {
    if (!ts) return 0;
    if (ts.toMillis) return ts.toMillis();
    if (ts.seconds) return ts.seconds * 1000;
    if (ts instanceof Date) return ts.getTime();
    if (typeof ts === 'number') return ts;
    return 0;
  }

  // Count weekday midnights from start date to now
  function calculateExpectedPayouts(createdAtMs, maxDays) {
    const now = Date.now();
    const createdDate = new Date(createdAtMs);
    createdDate.setHours(0, 0, 0, 0);
    
    let count = 0;
    let checkDate = new Date(createdDate);
    checkDate.setDate(checkDate.getDate() + 1); // Start day AFTER creation
    checkDate.setHours(0, 0, 0, 0);
    
    while (checkDate.getTime() <= now && count < maxDays) {
      const dayOfWeek = checkDate.getDay();
      if (dayOfWeek >= 1 && dayOfWeek <= 5) { // Mon-Fri
        count++;
      }
      checkDate.setDate(checkDate.getDate() + 1);
    }
    return count;
  }

  function showResult(msg, type) {
    const box = document.getElementById('resultBox');
    box.textContent = msg;
    box.className = 'result-box show ' + (type || 'ok');
    setTimeout(() => box.classList.remove('show'), 8000);
  }

  function setLoading(show) {
    document.getElementById('loadingBox').classList.toggle('show', show);
  }

  window.searchUser = async () => {
    const email = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!email) { showResult('Please enter an email address', 'err'); return; }

    setLoading(true);
    document.getElementById('userCard').classList.remove('show');

    try {
      const q = query(collection(db, 'users'), where('email', '==', email));
      const snap = await getDocs(q);

      if (snap.empty) {
        setLoading(false);
        showResult('User not found with email: ' + email, 'err');
        return;
      }

      const userDoc = snap.docs[0];
      foundUserId = userDoc.id;
      foundUserData = userDoc.data();

      // Display user info
      document.getElementById('userName').textContent = foundUserData.email?.split('@')[0] || 'User';
      document.getElementById('userEmail').textContent = foundUserData.email || email;

      const dpW = Number(foundUserData.depositWallet) || 0;
      const wdW = Number(foundUserData.withdrawalWallet) || 0;
      const ngW = Number(foundUserData.nairaWallet) || 0;

      const dpWEl = document.getElementById('uDepW');
      const wdWEl = document.getElementById('uWdW');
      const ngWEl = document.getElementById('uNgW');

      dpWEl.textContent = '$' + fu(dpW);
      wdWEl.textContent = '$' + fu(wdW);
      ngWEl.textContent = '₦' + ff(ngW);

      dpWEl.className = 'wa' + (isNaN(foundUserData.depositWallet) ? ' bad' : '');
      wdWEl.className = 'wa' + (isNaN(foundUserData.withdrawalWallet) ? ' bad' : '');
      ngWEl.className = 'wa' + (isNaN(foundUserData.nairaWallet) ? ' bad' : '');

      document.getElementById('uTotal').textContent = '$' + fu(dpW + wdW);
      document.getElementById('uRef').textContent = foundUserData.referralCode || foundUserId.substring(0, 8).toUpperCase();
      document.getElementById('uJoined').textContent = foundUserData.createdAt?.toMillis 
        ? new Date(foundUserData.createdAt.toMillis()).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' }) 
        : '—';

      // Load investments with ROI calculation
      await loadInvestments(foundUserId);

      document.getElementById('userCard').classList.add('show');
      setLoading(false);

    } catch (e) {
      console.error('Search error:', e);
      setLoading(false);
      showResult('Error: ' + e.message, 'err');
    }
  };

  async function loadInvestments(uid) {
    const list = document.getElementById('investList');
    investmentsList = [];
    totalMissingROI = 0;
    
    try {
      const snap = await getDocs(query(collection(db, 'investments'), where('userId', '==', uid)));
      if (snap.empty) {
        list.innerHTML = '<p style="color:var(--muted);text-align:center;">No investments found</p>';
        document.getElementById('totalMissing').textContent = '';
        return;
      }

      let html = '';
      snap.forEach(dc => {
        const inv = dc.data();
        const invId = dc.id;
        const planName = inv.planName || 'Plan';
        const amount = inv.amount || 0;
        const daily = inv.daily || 0;
        const maxDays = inv.days || 20;
        const daysPaid = inv.daysPaid || 0;
        const totalPaidOut = inv.totalPaidOut || 0;
        const status = inv.status || '?';
        const locked = inv.locked ? ' 🔒' : '';
        
        // ✅ Calculate REAL expected payouts from creation date
        const createdAtMs = getTimestampMs(inv.createdAt);
        const expectedPayouts = calculateExpectedPayouts(createdAtMs, maxDays);
        const expectedROI = expectedPayouts * daily;
        const missingROI = Math.max(0, expectedROI - totalPaidOut);
        
        totalMissingROI += missingROI;
        
        const purchaseDate = createdAtMs ? new Date(createdAtMs).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' }) : 'Unknown';
        
        // Store for later crediting
        investmentsList.push({
          id: invId,
          planName: planName,
          daily: daily,
          daysPaid: daysPaid,
          maxDays: maxDays,
          expectedPayouts: expectedPayouts,
          expectedROI: expectedROI,
          totalPaidOut: totalPaidOut,
          missingROI: missingROI,
          status: status,
          locked: inv.locked
        });

        html += `<div class="invest-card">
          <div class="ih">
            <span>${planName}${locked}</span>
            <span style="color:${status==='active'?'var(--success)':'var(--muted)'}">${status}</span>
          </div>
          <div class="id">Purchased: <span>${purchaseDate}</span> | Amount: <span>$${fu(amount)}</span></div>
          <div class="id">Daily: <span>$${fu(daily)}</span> | Days Paid: <span>${daysPaid}/${maxDays}</span></div>
          <div class="id">Expected Payouts (from start): <span>${expectedPayouts} days</span></div>
          <div class="id">Expected ROI: <span>$${fu(expectedROI)}</span> | Actually Paid: <span>$${fu(totalPaidOut)}</span></div>
          <div class="id" style="font-size:0.82rem;font-weight:700;">
            Missing ROI: 
            <span class="${missingROI > 0 ? 'red' : 'green'}">$${fu(missingROI)}</span>
          </div>
        </div>`;
      });
      
      list.innerHTML = html;
      
      // Show total missing
      const totalEl = document.getElementById('totalMissing');
      if (totalMissingROI > 0) {
        totalEl.innerHTML = `🔴 TOTAL MISSING ROI: <span style="color:var(--error);">$${fu(totalMissingROI)}</span>`;
      } else {
        totalEl.innerHTML = `✅ All ROI is up to date!`;
      }

    } catch (e) {
      list.innerHTML = '<p style="color:var(--error);">Error loading investments</p>';
    }
  }

  // ════════ FIX NAN WALLET ════════
  window.fixWallet = async () => {
    if (!foundUserId) return;
    if (!confirm('Reset any NaN wallet values to 0?')) return;
    try {
      const updates = {};
      if (isNaN(foundUserData.depositWallet)) updates.depositWallet = 0;
      if (isNaN(foundUserData.withdrawalWallet)) updates.withdrawalWallet = 0;
      if (isNaN(foundUserData.nairaWallet)) updates.nairaWallet = 0;
      if (isNaN(foundUserData.walletBalance)) updates.walletBalance = (Number(foundUserData.depositWallet)||0) + (Number(foundUserData.withdrawalWallet)||0);
      if (Object.keys(updates).length === 0) { showResult('No NaN values found.', 'ok'); return; }
      await updateDoc(doc(db, 'users', foundUserId), updates);
      showResult('✅ Wallet fixed! NaN reset to 0.', 'ok');
      const snap = await getDoc(doc(db, 'users', foundUserId));
      foundUserData = snap.data();
    } catch (e) { showResult('Error: ' + e.message, 'err'); }
  };

  // ════════ CREDIT ALL MISSING ROI ════════
  window.creditAllMissingROI = async () => {
    if (!foundUserId) return;
    if (investmentsList.length === 0) { showResult('No investments to process.', 'err'); return; }
    
    // Calculate total missing
    let totalToCredit = 0;
    investmentsList.forEach(inv => { totalToCredit += inv.missingROI; });
    
    if (totalToCredit <= 0) {
      showResult('No missing ROI to credit. All investments are up to date.', 'ok');
      return;
    }

    if (!confirm(`Credit $${fu(totalToCredit)} total missing ROI to this user's Withdrawal Wallet?\n\nThis covers ALL investments from their start date to today (weekdays only).`)) return;

    try {
      // Credit to withdrawal wallet
      const currentWdW = Number(foundUserData.withdrawalWallet) || 0;
      const currentDpW = Number(foundUserData.depositWallet) || 0;
      
      await updateDoc(doc(db, 'users', foundUserId), {
        withdrawalWallet: currentWdW + totalToCredit,
        walletBalance: currentDpW + currentWdW + totalToCredit
      });

      // Update each investment's daysPaid and totalPaidOut
      for (const inv of investmentsList) {
        if (inv.missingROI > 0) {
          await updateDoc(doc(db, 'investments', inv.id), {
            daysPaid: inv.expectedPayouts,
            totalPaidOut: inv.expectedROI,
            status: inv.expectedPayouts >= inv.maxDays ? 'completed' : 'active',
            lastPayoutDate: serverTimestamp()
          });
        }
      }

      showResult(`✅ $${fu(totalToCredit)} credited to Withdrawal Wallet!\nAll investments updated to correct days paid.`, 'ok');
      
      // Refresh display
      const snap = await getDoc(doc(db, 'users', foundUserId));
      foundUserData = snap.data();
      
      const wdW = Number(foundUserData.withdrawalWallet) || 0;
      document.getElementById('uWdW').textContent = '$' + fu(wdW);
      document.getElementById('uTotal').textContent = '$' + fu((Number(foundUserData.depositWallet)||0) + wdW);
      
      await loadInvestments(foundUserId);

    } catch (e) {
      showResult('Error: ' + e.message, 'err');
    }
  };
</script>
</body>
</html>
