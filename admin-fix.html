<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Find Broken Wallets</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0f0f1a; --card:#1a1a2e; --card2:#16213e;
    --primary:#5c3df4; --accent:#a78bfa; --text:#e2e8f0; --muted:#94a3b8;
    --border:#2d2d44; --input-bg:#1e1e38;
    --success:#16a34a; --error:#dc2626; --warn:#d97706;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;}
  .header{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid var(--border);text-align:center;}
  .header h1{font-size:1.3rem;font-weight:800;color:var(--accent);}
  .header p{font-size:0.8rem;color:var(--muted);margin-top:4px;}

  .btn{width:100%;height:50px;background:var(--primary);color:#fff;font-family:inherit;font-size:0.95rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;margin-bottom:10px;}
  .btn.success{background:var(--success);}.btn.warn{background:var(--warn);}.btn:disabled{opacity:0.5;}

  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .stat-box{background:var(--card);border-radius:12px;padding:14px;text-align:center;border:1px solid var(--border);}
  .stat-box .sv{font-size:1.3rem;font-weight:800;color:var(--accent);}
  .stat-box .sl{font-size:0.65rem;color:var(--muted);text-transform:uppercase;margin-top:2px;}

  .user-card{background:var(--card2);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border);}
  .user-card .ut{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px;}
  .user-card .ud{font-size:0.75rem;color:var(--muted);}
  .user-card .ud span{color:var(--text);}
  .user-card .ud .bad{color:var(--error);font-weight:700;}
  .user-card .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
  .user-card button{height:38px;border:none;border-radius:8px;font-family:inherit;font-size:0.75rem;font-weight:700;cursor:pointer;color:#fff;}
  .user-card button.fix{background:var(--warn);}
  .user-card button.credit{background:var(--success);}

  .log-box{background:#000;border-radius:10px;padding:12px;font-family:monospace;font-size:0.7rem;color:#6ee7b7;max-height:300px;overflow-y:auto;margin-top:10px;}
  .log-box .err{color:#fca5a5;}.log-box .warn{color:#fbbf24;}

  .spinner{width:24px;height:24px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:10px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading{text-align:center;padding:20px;display:none;}
  .loading.show{display:block;}
  .loading p{margin-top:8px;color:var(--muted);font-size:0.85rem;}

  .search-box{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--border);}
  .search-box input{width:100%;height:44px;background:var(--input-bg);border:2px solid var(--border);border-radius:10px;padding:0 12px;font-family:inherit;font-size:0.9rem;color:var(--text);outline:none;margin-bottom:8px;}
  .search-box input:focus{border-color:var(--primary);}
</style>
</head>
<body>

<div class="header">
  <h1>🔧 Find & Fix Broken Wallets</h1>
  <p>Find users with NaN/corrupted wallets and credit their missing ROI</p>
</div>

<div class="stats-grid">
  <div class="stat-box"><div class="sv" id="statTotal">0</div><div class="sl">Users Scanned</div></div>
  <div class="stat-box"><div class="sv" id="statBroken">0</div><div class="sl">Broken Wallets</div></div>
  <div class="stat-box"><div class="sv" id="statMissing">$0.00</div><div class="sl">Total Missing ROI</div></div>
</div>

<div class="search-box">
  <input type="text" id="searchEmail" placeholder="Search single user by email...">
  <button class="btn" onclick="searchSingle()">🔍 Search & Check User</button>
</div>

<button class="btn" onclick="scanAll()">🔍 Scan ALL Users for Broken Wallets</button>
<button class="btn success" id="btnFixAll" onclick="fixAllBroken()" disabled>💸 Fix ALL Broken Wallets & Credit Missing ROI</button>

<div class="loading" id="loadingBox"><div class="spinner"></div><p id="loadingText">Scanning...</p></div>

<div class="log-box" id="logBox"></div>

<div id="resultsList"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const fc = { apiKey:"AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain:"nexa-a8cad.firebaseapp.com", projectId:"nexa-a8cad", storageBucket:"nexa-a8cad.firebasestorage.app", messagingSenderId:"324559998149", appId:"1:324559998149:web:e23ddfa3f0c71114eab4ac" };
  const app = initializeApp(fc);
  const db = getFirestore(app);

  const fu = n => (Number(n)||0).toFixed(2);
  let brokenUsers = [];
  let totalMissingAll = 0;

  function log(msg, type) {
    const box = document.getElementById('logBox');
    const time = new Date().toLocaleTimeString();
    box.innerHTML += `<div class="${type||''}">[${time}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  function setLoading(s, t) {
    document.getElementById('loadingBox').classList.toggle('show', s);
    document.getElementById('loadingText').textContent = t || 'Processing...';
  }

  function getTs(ts) {
    if(!ts) return 0;
    if(ts.toMillis) return ts.toMillis();
    if(ts.seconds) return ts.seconds*1000;
    if(ts instanceof Date) return ts.getTime();
    return typeof ts==='number'?ts:0;
  }

  function calcExpected(createdMs, max) {
    const now = Date.now();
    const d = new Date(createdMs); d.setHours(0,0,0,0);
    let c=0, ch=new Date(d); ch.setDate(ch.getDate()+1); ch.setHours(0,0,0,0);
    while(ch.getTime()<=now&&c<max){if(ch.getDay()>=1&&ch.getDay()<=5)c++;ch.setDate(ch.getDate()+1);}
    return c;
  }

  // Check if user has broken wallet (NaN, undefined, or mismatch)
  function isWalletBroken(userData) {
    const dw = userData.depositWallet;
    const ww = userData.withdrawalWallet;
    const wb = userData.walletBalance;
    
    if (dw === undefined || dw === null) return true;
    if (ww === undefined || ww === null) return true;
    if (isNaN(dw) || isNaN(ww)) return true;
    
    return false;
  }

  // Calculate total missing ROI for a user's investments
  function calcMissingROI(investments) {
    let total = 0;
    const details = [];
    investments.forEach(inv => {
      const created = getTs(inv.createdAt);
      if (created === 0) return;
      const expected = calcExpected(created, inv.days||20);
      const expectedROI = expected * (inv.daily||0);
      const paid = inv.totalPaidOut || 0;
      const missing = Math.max(0, expectedROI - paid);
      if (missing > 0.001) {
        total += missing;
        details.push({
          id: inv.id,
          planName: inv.planName||'Plan',
          daysPaid: inv.daysPaid||0,
          expectedDays: expected,
          daily: inv.daily||0,
          expectedROI: expectedROI,
          paid: paid,
          missing: missing
        });
      }
    });
    return { total, details };
  }

  // Display results
  function showResults() {
    const list = document.getElementById('resultsList');
    if (brokenUsers.length === 0) {
      list.innerHTML = '<p style="text-align:center;color:var(--success);padding:20px;">✅ No broken wallets found!</p>';
      return;
    }
    let html = '';
    brokenUsers.forEach((u, i) => {
      html += `<div class="user-card">
        <div class="ut"><span>${u.email}</span><span style="color:var(--error);">Missing: $${fu(u.missingROI)}</span></div>
        <div class="ud">Deposit: <span class="${isNaN(u.depW)?'bad':''}">$${fu(u.depW)}</span> | Withdrawal: <span class="${isNaN(u.withW)?'bad':''}">$${fu(u.withW)}</span></div>
        <div class="ud">Investments: <span>${u.invCount}</span> | Broken: <span class="bad">${u.isBroken?'YES':'no'}</span></div>`;
      
      u.invDetails.forEach(inv => {
        html += `<div class="ud" style="margin-left:8px;margin-top:2px;">• ${inv.planName}: Day ${inv.daysPaid}→${inv.expectedDays} | Missing: <span class="bad">$${fu(inv.missing)}</span></div>`;
      });
      
      html += `<div class="btns">
        <button class="fix" onclick="fixSingle('${u.uid}', ${i})">🔧 Fix Wallet</button>
        <button class="credit" onclick="creditSingle('${u.uid}', ${i})">💸 Credit $${fu(u.missingROI)}</button>
      </div></div>`;
    });
    list.innerHTML = html;
    document.getElementById('btnFixAll').disabled = false;
  }

  // ════════ SCAN ALL USERS ════════
  window.scanAll = async () => {
    setLoading(true, 'Scanning all users...');
    log('🚀 Scanning all users for broken wallets...', 'warn');
    brokenUsers = [];
    totalMissingAll = 0;
    
    try {
      const usersSnap = await getDocs(collection(db, 'users'));
      let scanned = 0;
      
      for (const uDoc of usersSnap.docs) {
        const uData = uDoc.data();
        const uid = uDoc.id;
        const email = uData.email || 'no-email';
        const broken = isWalletBroken(uData);
        
        // Get investments
        const invSnap = await getDocs(query(collection(db, 'investments'), where('userId', '==', uid)));
        const investments = [];
        invSnap.forEach(d => investments.push({ id: d.id, ...d.data() }));
        
        // Calculate missing ROI
        const { total, details } = calcMissingROI(investments);
        
        // Include if wallet is broken OR has missing ROI
        if (broken || total > 0.001) {
          brokenUsers.push({
            uid, email,
            depW: uData.depositWallet,
            withW: uData.withdrawalWallet,
            nairaW: uData.nairaWallet,
            isBroken: broken,
            invCount: investments.length,
            invDetails: details,
            missingROI: total
          });
          totalMissingAll += total;
          
          if (broken) log(`🔴 ${email}: BROKEN wallet (dep=$${fu(uData.depositWallet)}, wd=$${fu(uData.withdrawalWallet)}) | Missing ROI: $${fu(total)}`, 'err');
          else if (total > 0) log(`⚠️ ${email}: Wallet OK but missing ROI: $${fu(total)}`, 'warn');
        }
        
        scanned++;
        document.getElementById('statTotal').textContent = scanned;
        document.getElementById('statBroken').textContent = brokenUsers.filter(u=>u.isBroken).length;
        document.getElementById('statMissing').textContent = '$'+fu(totalMissingAll);
        document.getElementById('loadingText').textContent = `Scanned ${scanned} users...`;
      }
      
      log(`✅ Done! ${brokenUsers.length} users need attention. Total missing: $${fu(totalMissingAll)}`, 'warn');
      showResults();
      
    } catch(e) { log(`❌ Error: ${e.message}`, 'err'); }
    setLoading(false);
  };

  // ════════ SEARCH SINGLE ════════
  window.searchSingle = async () => {
    const email = document.getElementById('searchEmail').value.trim().toLowerCase();
    if(!email){log('Enter email','err');return;}
    setLoading(true,'Searching...');
    log(`🔍 Searching: ${email}`);
    
    try {
      const q = query(collection(db,'users'), where('email','==',email));
      const snap = await getDocs(q);
      if(snap.empty){log('Not found','err');setLoading(false);return;}
      
      const uDoc = snap.docs[0];
      const uData = uDoc.data();
      const uid = uDoc.id;
      const broken = isWalletBroken(uData);
      
      const invSnap = await getDocs(query(collection(db,'investments'), where('userId','==',uid)));
      const investments = [];
      invSnap.forEach(d => investments.push({id:d.id,...d.data()}));
      
      const {total, details} = calcMissingROI(investments);
      
      log(`📊 ${email}:`, '');
      log(`   Deposit: $${fu(uData.depositWallet)} | Withdrawal: $${fu(uData.withdrawalWallet)} | Broken: ${broken?'YES':'no'}`, broken?'err':'');
      
      details.forEach(inv => {
        log(`   📋 ${inv.planName}: Day ${inv.daysPaid}/${inv.expectedDays} | Paid: $${fu(inv.paid)} | Expected: $${fu(inv.expectedROI)} | Missing: $${fu(inv.missing)}`, inv.missing>0?'err':'');
      });
      
      log(`   💰 TOTAL MISSING: $${fu(total)}`, total>0?'err':'warn');
      
      if(broken || total>0){
        brokenUsers = [{uid, email, depW:uData.depositWallet, withW:uData.withdrawalWallet, isBroken:broken, invCount:investments.length, invDetails:details, missingROI:total}];
        totalMissingAll = total;
        showResults();
      }
      
    } catch(e){log(`Error: ${e.message}`,'err');}
    setLoading(false);
  };

  // ════════ FIX SINGLE USER ════════
  window.fixSingle = async (uid, idx) => {
    const user = brokenUsers[idx];
    if(!confirm(`Fix wallet for ${user.email}? NaN → 0`)) return;
    try {
      const snap = await getDoc(doc(db,'users',uid));
      const d = snap.data();
      const u = {};
      if(isNaN(d.depositWallet)||d.depositWallet===undefined||d.depositWallet===null) u.depositWallet = 0;
      if(isNaN(d.withdrawalWallet)||d.withdrawalWallet===undefined||d.withdrawalWallet===null) u.withdrawalWallet = 0;
      if(isNaN(d.nairaWallet)||d.nairaWallet===undefined||d.nairaWallet===null) u.nairaWallet = 0;
      if(isNaN(d.walletBalance)||d.walletBalance===undefined||d.walletBalance===null) u.walletBalance = (Number(d.depositWallet)||0)+(Number(d.withdrawalWallet)||0);
      if(Object.keys(u).length===0){log('No NaN found','warn');return;}
      await updateDoc(doc(db,'users',uid), u);
      log(`✅ Fixed ${user.email}: NaN reset to 0`,'warn');
      user.isBroken = false;
      user.depW = u.depositWallet ?? d.depositWallet;
      user.withW = u.withdrawalWallet ?? d.withdrawalWallet;
      showResults();
    } catch(e){log(`Error: ${e.message}`,'err');}
  };

  // ════════ CREDIT SINGLE USER ════════
  window.creditSingle = async (uid, idx) => {
    const user = brokenUsers[idx];
    const amt = user.missingROI;
    if(amt <= 0){log('No missing ROI','warn');return;}
    if(!confirm(`Credit $${fu(amt)} to ${user.email}?`)) return;
    try {
      const snap = await getDoc(doc(db,'users',uid));
      const d = snap.data();
      const w = Number(d.withdrawalWallet)||0;
      const dp = Number(d.depositWallet)||0;
      
      await updateDoc(doc(db,'users',uid), {
        withdrawalWallet: w + amt,
        walletBalance: dp + w + amt
      });
      
      // Update investments
      for(const inv of user.invDetails){
        if(inv.missing > 0.001){
          await updateDoc(doc(db,'investments',inv.id), {
            daysPaid: inv.expectedDays,
            totalPaidOut: inv.expectedROI,
            status: inv.expectedDays >= 20 ? 'completed' : 'active',
            lastPayoutDate: serverTimestamp()
          });
        }
      }
      
      log(`✅ Credited $${fu(amt)} to ${user.email}`,'warn');
      user.missingROI = 0;
      user.withW = w + amt;
      user.invDetails.forEach(i => i.missing = 0);
      showResults();
    } catch(e){log(`Error: ${e.message}`,'err');}
  };

  // ════════ FIX ALL ════════
  window.fixAllBroken = async () => {
    const needFix = brokenUsers.filter(u => u.isBroken || u.missingROI > 0.001);
    if(needFix.length===0){log('Nothing to fix','warn');return;}
    if(!confirm(`Fix & credit ${needFix.length} users? Total: $${fu(totalMissingAll)}`)) return;
    
    document.getElementById('btnFixAll').disabled = true;
    let fixed=0, errs=0;
    
    for(const user of needFix){
      try {
        const snap = await getDoc(doc(db,'users',user.uid));
        const d = snap.data();
        const w = Number(d.withdrawalWallet)||0;
        const dp = Number(d.depositWallet)||0;
        
        const up = {};
        if(isNaN(d.depositWallet)||d.depositWallet===undefined) up.depositWallet = 0;
        if(isNaN(d.withdrawalWallet)||d.withdrawalWallet===undefined) up.withdrawalWallet = (Number(d.depositWallet)||0) + user.missingROI;
        else up.withdrawalWallet = w + user.missingROI;
        if(isNaN(d.nairaWallet)||d.nairaWallet===undefined) up.nairaWallet = 0;
        up.walletBalance = (up.depositWallet??dp) + (up.withdrawalWallet??w) + user.missingROI;
        
        await updateDoc(doc(db,'users',user.uid), up);
        
        for(const inv of user.invDetails){
          if(inv.missing > 0.001){
            await updateDoc(doc(db,'investments',inv.id), {
              daysPaid: inv.expectedDays,
              totalPaidOut: inv.expectedROI,
              status: inv.expectedDays >= 20 ? 'completed' : 'active',
              lastPayoutDate: serverTimestamp()
            });
          }
        }
        fixed++;
        log(`✅ ${user.email}: Fixed + credited $${fu(user.missingROI)}`);
      } catch(e){errs++;log(`❌ ${user.email}: ${e.message}`,'err');}
    }
    
    log(`🎉 Done! ${fixed} fixed, ${errs} errors`,'warn');
    document.getElementById('btnFixAll').disabled = false;
    await window.scanAll(); // Refresh
  };
</script>
</body>
</html>
