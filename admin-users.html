<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa Admin – Users</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0f0a1e;--card:#1a1333;--sidebar:#120c24;--primary:#7c3aed;--primary-dark:#6d28d9;--primary-soft:#2d1b69;--accent:#a78bfa;--text:#f5f3ff;--muted:#9d94b8;--border:#2d1f5e;--input-bg:#1e1644;--error:#ef4444;--success:#22c55e;--warn:#f59e0b;--sidebar-width:250px;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;}

  .sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:30;overflow-y:auto;overflow-x:hidden;padding:16px 0;}
  .sidebar-inner{padding:0 14px;display:flex;flex-direction:column;flex:1;}
  .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:4px 6px;text-decoration:none;flex-shrink:0;}
  .logo-icon{width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(124,58,237,0.4);}
  .logo-icon svg{width:20px;height:20px;color:#fff;}
  .sidebar .logo span{font-size:1.1rem;font-weight:800;color:var(--text);white-space:nowrap;}
  .sidebar .logo em{color:var(--accent);font-style:normal;}
  .nav-section{font-size:0.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:18px 6px 8px;flex-shrink:0;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-size:0.84rem;font-weight:600;margin-bottom:2px;transition:all 0.15s;flex-shrink:0;}
  .nav-item:hover{background:var(--primary-soft);color:var(--text);}
  .nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,0.3);}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;}
  .nav-spacer{flex:1;}
  .nav-item.logout{color:var(--error);margin-top:8px;}
  .nav-item.logout:hover{background:rgba(239,68,68,0.15);}

  .main-content{flex:1;margin-left:var(--sidebar-width);padding:24px 28px;min-height:100vh;overflow-y:auto;overflow-x:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:1.5rem;font-weight:800;}

  .search-box{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:8px 14px;max-width:350px;min-width:200px;}
  .search-box svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;}
  .search-box input{background:none;border:none;color:var(--text);font-family:inherit;font-size:0.85rem;outline:none;width:100%;}
  .search-box input::placeholder{color:var(--muted);}

  .stats-mini{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0;}
  .stat-mini{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:0.8rem;}
  .stat-mini .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .stat-mini .dot.green{background:var(--success);}
  .stat-mini .dot.red{background:var(--error);}
  .stat-mini .dot.amber{background:var(--warn);}
  .stat-mini strong{color:var(--text);}

  .section-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:auto;max-height:calc(100vh - 240px);}
  .section-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:2;}
  .section-header h3{font-size:1rem;font-weight:700;}

  table{width:100%;border-collapse:collapse;min-width:700px;}
  table th{font-size:0.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:10px 10px;text-align:left;background:var(--input-bg);white-space:nowrap;position:sticky;top:52px;z-index:1;}
  table td{font-size:0.78rem;padding:10px;border-bottom:1px solid var(--border);}
  table tr:hover{background:rgba(124,58,237,0.04);}

  .status-pill{font-size:0.6rem;font-weight:700;padding:4px 10px;border-radius:50px;display:inline-block;}
  .status-pill.active{background:rgba(34,197,94,0.2);color:var(--success);}
  .status-pill.suspended{background:rgba(239,68,68,0.2);color:var(--error);}

  .btn{font-size:0.64rem;font-weight:700;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;transition:all 0.15s;margin:2px;text-decoration:none;display:inline-block;white-space:nowrap;}
  .btn.view{background:rgba(59,130,246,0.2);color:#60a5fa;}
  .btn.view:hover{background:rgba(59,130,246,0.4);}
  .btn.suspend{background:rgba(245,158,11,0.2);color:var(--warn);}
  .btn.suspend:hover{background:rgba(245,158,11,0.4);}
  .btn.unsuspend{background:rgba(34,197,94,0.2);color:var(--success);}
  .btn.unsuspend:hover{background:rgba(34,197,94,0.4);}
  .btn.impersonate{background:rgba(124,58,237,0.2);color:var(--accent);}
  .btn.impersonate:hover{background:rgba(124,58,237,0.4);}

  .loading{text-align:center;padding:60px 20px;}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{font-size:0.85rem;color:var(--muted);}
  .empty{text-align:center;padding:50px;color:var(--muted);}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px 24px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;animation:modalIn .25s ease;}
  @keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal h3{font-size:1.05rem;font-weight:800;margin-bottom:16px;position:sticky;top:0;background:var(--card);padding-bottom:10px;z-index:2;}
  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .info-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;}
  .info-item .l{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;}
  .info-item .v{font-size:0.82rem;font-weight:700;color:var(--text);word-break:break-all;}
  .info-item.full{grid-column:1/-1;}
  .form-field{margin-bottom:10px;}
  .form-field label{display:block;font-size:0.66rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
  .form-field input,.form-field select{width:100%;height:44px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:0 14px;font-family:inherit;font-size:0.86rem;color:var(--text);outline:none;}
  .form-field input:focus,.form-field select:focus{border-color:var(--primary);}
  .modal-actions{display:flex;gap:10px;margin-top:12px;position:sticky;bottom:0;background:var(--card);padding-top:12px;z-index:2;}
  .modal-btn{flex:1;padding:11px;border:none;border-radius:11px;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.15s;text-align:center;text-decoration:none;}
  .modal-btn.primary{background:var(--primary);color:#fff;}
  .modal-btn.primary:hover{background:var(--primary-dark);}
  .modal-btn.ghost{background:var(--input-bg);color:var(--muted);border:1px solid var(--border);}
  .modal-btn.success{background:var(--success);color:#fff;}
  .modal-btn.success:hover{background:#15803d;}
  .modal-btn.danger{background:var(--error);color:#fff;}
  .modal-btn.danger:hover{background:#b91c1c;}

  @media(max-width:900px){
    :root{--sidebar-width:60px;}
    .sidebar{padding:12px 0;}.sidebar-inner{padding:0 8px;}
    .sidebar .logo span,.nav-item span,.nav-section{display:none;}
    .nav-item{justify-content:center;padding:12px;}
    .logo-icon{width:36px;height:36px;}
    .main-content{padding:16px;}
    .section-card{max-height:calc(100vh - 220px);}
    .info-grid{grid-template-columns:1fr;}
    table{min-width:600px;font-size:0.7rem;}
    table th,table td{padding:6px 8px;}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-inner">
    <a class="logo" href="admin-dashboard.html"><div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span>Nex<em>a</em> Admin</span></a>
    <div class="nav-section">Main</div>
    <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span>Dashboard</span></a>
    <div class="nav-section">Management</div>
    <a href="admin-deposits.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M12 18V6"/></svg><span>Deposits</span></a>
    <a href="admin-withdrawals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 010-4h12v4"/></svg><span>Withdrawals</span></a>
    <a href="admin-investments.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg><span>Investments</span></a>
    <a href="admin-referrals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>Referrals</span></a>
    <div class="nav-section">Users</div>
    <a href="admin-users.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>All Users</span></a>
    <div class="nav-section">System</div>
    <a href="admin-settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></a>
    <div class="nav-spacer"></div>
    <a href="#" class="nav-item logout" onclick="adminLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/></svg><span>Logout</span></a>
  </div>
</aside>

<div class="main-content">
  <div class="topbar">
    <h1>User Management</h1>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search users..." oninput="searchUsers()" />
    </div>
  </div>

  <div class="stats-mini">
    <div class="stat-mini"><div class="dot green"></div>Active: <strong id="activeCount">0</strong></div>
    <div class="stat-mini"><div class="dot red"></div>Suspended: <strong id="suspendedCount">0</strong></div>
    <div class="stat-mini"><div class="dot amber"></div>Total: <strong id="totalCount">0</strong></div>
  </div>

  <div class="section-card">
    <div class="section-header"><h3>All Registered Users</h3></div>
    <div id="usersTable"><div class="loading"><div class="spinner"></div><p>Loading users...</p></div></div>
  </div>
</div>

<div class="modal-overlay" id="userModal"><div class="modal" id="userModalContent"></div></div>

<div id="toast" style="display:none;position:fixed;top:20px;right:20px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-size:0.85rem;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,0.5);animation:slideIn .3s ease;max-width:350px;"></div>
<style>@keyframes slideIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc, serverTimestamp, increment, where, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain: "nexa-a8cad.firebaseapp.com", projectId: "nexa-a8cad", storageBucket: "nexa-a8cad.firebasestorage.app", messagingSenderId: "324559998149", appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const fmtUSD = n => (n||0).toFixed(2);
  let allUsers = [];

  window.adminLogout = async () => { sessionStorage.removeItem('nexa_admin_logged'); await signOut(auth); window.location.href = 'admin-login.html'; };

  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = msg; toast.style.display = 'block';
    toast.style.borderColor = type === 'success' ? 'var(--success)' : 'var(--error)';
    toast.style.color = type === 'success' ? 'var(--success)' : 'var(--error)';
    setTimeout(() => toast.style.display = 'none', 3000);
  }

  window.searchUsers = () => {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allUsers.filter(u => 
      (u.email||'').toLowerCase().includes(term) || 
      (u.phone||'').toLowerCase().includes(term) ||
      (u.referralCode||'').toLowerCase().includes(term)
    );
    renderUsers(filtered);
  };

  window.viewUserDetails = async (uid) => {
    const user = allUsers.find(u => u.uid === uid);
    if (!user) return;
    const modal = document.getElementById('userModalContent');
    modal.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading details...</p></div>';
    document.getElementById('userModal').classList.add('show');

    const [depSnap, withSnap, invSnap, refSnap] = await Promise.all([
      getDocs(query(collection(db, 'deposits'), where('userId','==',uid))),
      getDocs(query(collection(db, 'withdrawals'), where('userId','==',uid))),
      getDocs(query(collection(db, 'investments'), where('userId','==',uid))),
      getDocs(query(collection(db, 'referralLogs'), where('uplineId','==',uid)))
    ]);

    let totalDeposited = 0, totalWithdrawn = 0, totalInvested = 0;
    depSnap.forEach(d => { if(d.data().status==='approved') totalDeposited += d.data().amount||0; });
    withSnap.forEach(d => { totalWithdrawn += d.data().amount||0; });
    invSnap.forEach(d => { totalInvested += d.data().amount||0; });
    const activePlans = invSnap.docs.filter(d => d.data().status==='active'&&!d.data().locked).length;
    const joinDate = user.createdAt?.toMillis ? new Date(user.createdAt.toMillis()).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' }) : '—';
    const isSuspended = user.status === 'suspended';

    modal.innerHTML = `
      <h3>👤 ${user.email||'User'}</h3>
      <div class="info-grid">
        <div class="info-item"><div class="l">Balance</div><div class="v" style="color:var(--success);">$${fmtUSD(user.walletBalance||0)}</div></div>
        <div class="info-item"><div class="l">Status</div><div class="v"><span class="status-pill ${isSuspended?'suspended':'active'}">${isSuspended?'Suspended':'Active'}</span></div></div>
        <div class="info-item"><div class="l">Phone</div><div class="v">${user.phone||'—'}</div></div>
        <div class="info-item"><div class="l">Earnings</div><div class="v">$${fmtUSD(user.totalEarnings||0)}</div></div>
        <div class="info-item"><div class="l">Ref Code</div><div class="v" style="font-family:monospace;">${user.referralCode||'—'}</div></div>
        <div class="info-item"><div class="l">Joined</div><div class="v">${joinDate}</div></div>
        <div class="info-item"><div class="l">Deposited</div><div class="v">$${fmtUSD(totalDeposited)}</div></div>
        <div class="info-item"><div class="l">Withdrawn</div><div class="v">$${fmtUSD(totalWithdrawn)}</div></div>
        <div class="info-item"><div class="l">Invested</div><div class="v">$${fmtUSD(totalInvested)}</div></div>
        <div class="info-item"><div class="l">Active Plans</div><div class="v">${activePlans}</div></div>
        <div class="info-item"><div class="l">Referrals</div><div class="v">${refSnap.size}</div></div>
        <div class="info-item full"><div class="l">UID</div><div class="v" style="font-size:0.6rem;font-family:monospace;">${uid}</div></div>
      </div>
      <h4 style="margin:14px 0 8px;font-size:0.85rem;">💰 Adjust Balance</h4>
      <div class="form-field"><label>Action</label><select id="adjustAction"><option value="add">Add Funds</option><option value="deduct">Deduct Funds</option></select></div>
      <div class="form-field"><label>Amount (USDT)</label><input type="number" id="adjustAmount" placeholder="0.00" step="0.01" min="0.01" /></div>
      <div class="form-field"><label>Reason</label><input type="text" id="adjustReason" placeholder="e.g., Bonus, Correction" /></div>
      <div class="modal-actions">
        <button class="modal-btn ghost" id="modalClose">Close</button>
        <button class="modal-btn success" id="modalAdjust">💵 Apply</button>
      </div>
      <div class="modal-actions" style="margin-top:6px;">
        ${isSuspended 
          ? `<button class="modal-btn success" id="modalUnsuspend">✅ Unsuspend</button>`
          : `<button class="modal-btn danger" id="modalSuspend">🚫 Suspend</button>`
        }
        <a href="admin-user-detail.html?uid=${uid}" class="modal-btn primary">🔍 Full Profile</a>
      </div>
    `;

    document.getElementById('modalClose').addEventListener('click', closeUserModal);
    document.getElementById('modalAdjust').addEventListener('click', () => adjustBalance(uid));
    if (isSuspended) {
      document.getElementById('modalUnsuspend').addEventListener('click', () => toggleSuspend(uid, 'active'));
    } else {
      document.getElementById('modalSuspend').addEventListener('click', () => toggleSuspend(uid, 'suspended'));
    }
  };

  window.closeUserModal = () => document.getElementById('userModal').classList.remove('show');

  window.adjustBalance = async (uid) => {
    const action = document.getElementById('adjustAction').value;
    const amount = parseFloat(document.getElementById('adjustAmount').value);
    const reason = document.getElementById('adjustReason').value.trim();
    if (!amount || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }
    if (!reason) { showToast('Enter a reason', 'error'); return; }
    const change = action === 'add' ? amount : -amount;
    const actionWord = action === 'add' ? 'added to' : 'deducted from';
    if (!confirm(`${action.toUpperCase()} $${fmtUSD(amount)} ${actionWord} wallet?`)) return;
    try {
      await updateDoc(doc(db, 'users', uid), { walletBalance: increment(change) });
      try { await addDoc(collection(db, 'adminLogs'), { userId: uid, action, amount, reason, adminEmail: auth.currentUser?.email, createdAt: serverTimestamp() }); } catch {}
      showToast(`$${fmtUSD(amount)} ${actionWord} wallet`, 'success');
      closeUserModal(); loadUsers();
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window.toggleSuspend = async (uid, newStatus) => {
    const msg = newStatus === 'suspended' ? 'Suspend this user?' : 'Unsuspend this user?';
    if (!confirm(msg)) return;
    try {
      await updateDoc(doc(db, 'users', uid), { status: newStatus });
      showToast(`User ${newStatus}`, 'success');
      closeUserModal(); loadUsers();
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  function renderUsers(users) {
    document.getElementById('activeCount').textContent = users.filter(u => u.status !== 'suspended').length;
    document.getElementById('suspendedCount').textContent = users.filter(u => u.status === 'suspended').length;
    document.getElementById('totalCount').textContent = users.length;

    if (users.length === 0) {
      document.getElementById('usersTable').innerHTML = '<div class="empty"><p>No users found</p></div>';
      return;
    }

    let html = '<table><tr><th>User</th><th>Balance</th><th>Ref Code</th><th>Status</th><th>Joined</th><th>Actions</th></tr>';
    users.forEach(u => {
      const joinDate = u.createdAt?.toMillis ? new Date(u.createdAt.toMillis()).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' }) : '—';
      const uid = u.uid;
      const isSuspended = u.status === 'suspended';
      html += `<tr>
        <td><strong>${u.email||'—'}</strong><br><small>${u.phone||''}</small></td>
        <td style="font-weight:700;">$${fmtUSD(u.walletBalance||0)}</td>
        <td style="font-family:monospace;font-size:0.7rem;">${u.referralCode||'—'}</td>
        <td><span class="status-pill ${isSuspended?'suspended':'active'}">${isSuspended?'Suspended':'Active'}</span></td>
        <td>${joinDate}</td>
        <td>
          <button class="btn view" data-uid="${uid}">📋 View</button>
          ${isSuspended 
            ? `<button class="btn unsuspend" data-uid="${uid}">Unblock</button>`
            : `<button class="btn suspend" data-uid="${uid}">Suspend</button>`
          }
          <a href="admin-user-detail.html?uid=${uid}" class="btn impersonate">Full</a>
        </td></tr>`;
    });
    html += '</table>';
    document.getElementById('usersTable').innerHTML = html;

    document.querySelectorAll('.btn.view').forEach(b => b.addEventListener('click', () => viewUserDetails(b.dataset.uid)));
    document.querySelectorAll('.btn.suspend').forEach(b => b.addEventListener('click', () => toggleSuspend(b.dataset.uid, 'suspended')));
    document.querySelectorAll('.btn.unsuspend').forEach(b => b.addEventListener('click', () => toggleSuspend(b.dataset.uid, 'active')));
  }

  async function loadUsers() {
    try {
      const snap = await getDocs(query(collection(db, 'users'), orderBy('createdAt', 'desc')));
      allUsers = [];
      snap.forEach(d => allUsers.push({ uid: d.id, ...d.data() }));
      renderUsers(allUsers);
    } catch (err) {
      document.getElementById('usersTable').innerHTML = '<div class="empty"><p>Error loading users.</p></div>';
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user || !sessionStorage.getItem('nexa_admin_logged')) { window.location.href = 'admin-login.html'; return; }
    loadUsers();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeUserModal(); });
</script>
</body>
</html>
