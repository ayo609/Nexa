<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa Admin – Users</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0f0a1e;--card:#1a1333;--sidebar:#120c24;--primary:#7c3aed;--primary-dark:#6d28d9;--primary-soft:#2d1b69;--accent:#a78bfa;--text:#f5f3ff;--muted:#9d94b8;--border:#2d1f5e;--input-bg:#1e1644;--error:#ef4444;--success:#22c55e;--warn:#f59e0b;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}

  .sidebar{width:250px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:20;overflow-y:auto;}
  .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:8px;text-decoration:none;}
  .logo-icon{width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:20px;height:20px;color:#fff;}
  .sidebar .logo span{font-size:1.1rem;font-weight:800;color:var(--text);}
  .sidebar .logo em{color:var(--accent);font-style:normal;}
  .nav-section{font-size:0.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:16px 12px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-size:0.84rem;font-weight:600;margin-bottom:2px;transition:all 0.2s;}
  .nav-item:hover{background:var(--primary-soft);color:var(--text);}
  .nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,0.3);}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;}
  .main-content{flex:1;margin-left:250px;padding:24px 28px;min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:1.5rem;font-weight:800;}

  .search-box{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:8px 14px;max-width:350px;}
  .search-box svg{width:18px;height:18px;color:var(--muted);flex-shrink:0;}
  .search-box input{background:none;border:none;color:var(--text);font-family:inherit;font-size:0.85rem;outline:none;width:100%;}
  .search-box input::placeholder{color:var(--muted);}

  .stats-mini{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-mini{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;}
  .stat-mini .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .stat-mini .dot.green{background:var(--success);}
  .stat-mini .dot.red{background:var(--error);}
  .stat-mini .dot.amber{background:var(--warn);}
  .stat-mini span{font-size:0.82rem;font-weight:600;}

  .section-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .section-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .section-header h3{font-size:1rem;font-weight:700;}

  table{width:100%;border-collapse:collapse;}
  table th{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:12px 14px;text-align:left;background:var(--input-bg);white-space:nowrap;}
  table td{font-size:0.84rem;padding:12px 14px;border-bottom:1px solid var(--border);}
  table tr:hover{background:rgba(124,58,237,0.04);}

  .status-pill{font-size:0.66rem;font-weight:700;padding:4px 10px;border-radius:50px;display:inline-block;}
  .status-pill.active{background:rgba(34,197,94,0.2);color:var(--success);}
  .status-pill.suspended{background:rgba(239,68,68,0.2);color:var(--error);}

  .btn{font-size:0.7rem;font-weight:700;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s;margin:2px;text-decoration:none;display:inline-block;}
  .btn.view{background:rgba(59,130,246,0.2);color:#60a5fa;}
  .btn.view:hover{background:rgba(59,130,246,0.4);}
  .btn.suspend{background:rgba(245,158,11,0.2);color:var(--warn);}
  .btn.suspend:hover{background:rgba(245,158,11,0.4);}
  .btn.unsuspend{background:rgba(34,197,94,0.2);color:var(--success);}
  .btn.unsuspend:hover{background:rgba(34,197,94,0.4);}
  .btn.impersonate{background:rgba(124,58,237,0.2);color:var(--accent);}
  .btn.impersonate:hover{background:rgba(124,58,237,0.4);}
  .btn.danger{background:rgba(239,68,68,0.2);color:var(--error);}
  .btn.danger:hover{background:rgba(239,68,68,0.4);}

  .loading{text-align:center;padding:60px;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{text-align:center;padding:50px;color:var(--muted);}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{font-size:1.1rem;font-weight:800;margin-bottom:20px;}
  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .info-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;}
  .info-item .l{font-size:0.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .info-item .v{font-size:0.85rem;font-weight:700;color:var(--text);word-break:break-all;}
  .info-item.full{grid-column:1/-1;}
  .form-field{margin-bottom:14px;}
  .form-field label{display:block;font-size:0.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .form-field input,.form-field select{width:100%;height:48px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:0 14px;font-family:inherit;font-size:0.9rem;color:var(--text);outline:none;}
  .form-field input:focus,.form-field select:focus{border-color:var(--primary);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-btn{flex:1;padding:12px;border:none;border-radius:12px;font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .modal-btn.primary{background:var(--primary);color:#fff;}
  .modal-btn.ghost{background:var(--input-bg);color:var(--muted);border:1px solid var(--border);}
  .modal-btn.success{background:var(--success);color:#fff;}
  .modal-btn.danger{background:var(--error);color:#fff;}

  @media(max-width:900px){.sidebar{width:65px;padding:12px 6px;}.sidebar .logo span,.nav-item span,.nav-section{display:none;}.nav-item{justify-content:center;padding:12px 8px;}.main-content{margin-left:65px;padding:16px;}.info-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<aside class="sidebar">
  <a class="logo" href="admin-dashboard.html"><div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span>Nex<em>a</em> Admin</span></a>
  <div class="nav-section">Main</div>
  <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Dashboard</a>
  <div class="nav-section">Management</div>
  <a href="admin-deposits.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/></svg>Deposits</a>
  <a href="admin-withdrawals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 010-4h12v4"/></svg>Withdrawals</a>
  <a href="admin-investments.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>Investments</a>
  <a href="admin-referrals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>Referrals</a>
  <div class="nav-section">Users</div>
  <a href="admin-users.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>All Users</a>
  <div class="nav-section">System</div>
  <a href="admin-settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  <a href="#" class="nav-item" style="color:var(--error);margin-top:auto;" onclick="adminLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/></svg>Logout</a>
</aside>

<div class="main-content">
  <div class="topbar">
    <h1>User Management</h1>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search by email or phone..." oninput="searchUsers()" />
    </div>
  </div>

  <div class="stats-mini">
    <div class="stat-mini"><div class="dot green"></div><span>Active: <strong id="activeCount">0</strong></span></div>
    <div class="stat-mini"><div class="dot red"></div><span>Suspended: <strong id="suspendedCount">0</strong></span></div>
    <div class="stat-mini"><div class="dot amber"></div><span>Total: <strong id="totalCount">0</strong></span></div>
  </div>

  <div class="section-card">
    <div class="section-header"><h3>All Registered Users</h3></div>
    <div id="usersTable"><div class="loading"><div class="spinner"></div><p>Loading users...</p></div></div>
  </div>
</div>

<!-- USER DETAIL MODAL -->
<div class="modal-overlay" id="userModal">
  <div class="modal" id="userModalContent"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc, serverTimestamp, increment, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain: "nexa-a8cad.firebaseapp.com", projectId: "nexa-a8cad", storageBucket: "nexa-a8cad.firebasestorage.app", messagingSenderId: "324559998149", appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const fmtUSD = n => (n||0).toFixed(2);
  const fmt = n => Math.round(n||0).toLocaleString();
  let allUsers = [];

  window.adminLogout = async () => { sessionStorage.removeItem('nexa_admin_logged'); await signOut(auth); window.location.href = 'admin-login.html'; };

  window.searchUsers = () => {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allUsers.filter(u => 
      (u.email||'').toLowerCase().includes(term) || 
      (u.phone||'').toLowerCase().includes(term) ||
      (u.referralCode||'').toLowerCase().includes(term)
    );
    renderUsers(filtered);
  };

  // ── VIEW USER DETAILS ──
  window.viewUserDetails = async (user) => {
    const modal = document.getElementById('userModalContent');
    modal.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading user details...</p></div>';
    document.getElementById('userModal').classList.add('show');

    // Fetch additional data
    const [depSnap, withSnap, invSnap, refSnap] = await Promise.all([
      getDocs(query(collection(db, 'deposits'), where('userId','==',user.uid))),
      getDocs(query(collection(db, 'withdrawals'), where('userId','==',user.uid))),
      getDocs(query(collection(db, 'investments'), where('userId','==',user.uid))),
      getDocs(query(collection(db, 'referralLogs'), where('fromUserId','==',user.uid)))
    ]);

    let totalDeposited = 0, totalWithdrawn = 0, totalInvested = 0;
    depSnap.forEach(d => { if(d.data().status==='approved') totalDeposited += d.data().amount||0; });
    withSnap.forEach(d => { totalWithdrawn += d.data().amount||0; });
    invSnap.forEach(d => { totalInvested += d.data().amount||0; });
    const activePlans = invSnap.docs.filter(d => d.data().status==='active').length;

    const joinDate = user.createdAt?.toMillis ? new Date(user.createdAt.toMillis()).toLocaleString('en-US', { day:'numeric', month:'long', year:'numeric' }) : '—';

    modal.innerHTML = `
      <h3>👤 User Details</h3>
      <div class="info-grid">
        <div class="info-item"><div class="l">Email</div><div class="v">${user.email||'—'}</div></div>
        <div class="info-item"><div class="l">Phone</div><div class="v">${user.phone||'—'}</div></div>
        <div class="info-item"><div class="l">User ID</div><div class="v" style="font-size:0.65rem;font-family:monospace;">${user.uid||'—'}</div></div>
        <div class="info-item"><div class="l">Status</div><div class="v"><span class="status-pill ${user.status==='suspended'?'suspended':'active'}">${user.status||'active'}</span></div></div>
        <div class="info-item"><div class="l">Wallet Balance</div><div class="v" style="color:var(--success);">$${fmtUSD(user.walletBalance||0)}</div></div>
        <div class="info-item"><div class="l">Total Earnings</div><div class="v">$${fmtUSD(user.totalEarnings||0)}</div></div>
        <div class="info-item"><div class="l">Referral Code</div><div class="v" style="font-family:monospace;">${user.referralCode||'—'}</div></div>
        <div class="info-item"><div class="l">Referred By</div><div class="v" style="font-size:0.7rem;">${user.referredBy||'None'}</div></div>
        <div class="info-item"><div class="l">Joined</div><div class="v">${joinDate}</div></div>
        <div class="info-item"><div class="l">Currency</div><div class="v">${user.currency||'USDT'}</div></div>
        <div class="info-item"><div class="l">Total Deposited</div><div class="v">$${fmtUSD(totalDeposited)}</div></div>
        <div class="info-item"><div class="l">Total Withdrawn</div><div class="v">$${fmtUSD(totalWithdrawn)}</div></div>
        <div class="info-item"><div class="l">Total Invested</div><div class="v">$${fmtUSD(totalInvested)}</div></div>
        <div class="info-item"><div class="l">Active Plans</div><div class="v">${activePlans}</div></div>
        <div class="info-item"><div class="l">Referrals Made</div><div class="v">${refSnap.size}</div></div>
      </div>

      <h4 style="margin:16px 0 10px;font-size:0.9rem;">💰 Adjust Wallet Balance</h4>
      <div class="form-field"><label>Action</label><select id="adjustAction"><option value="add">Add Funds</option><option value="deduct">Deduct Funds</option></select></div>
      <div class="form-field"><label>Amount (USDT)</label><input type="number" id="adjustAmount" placeholder="0.00" step="0.01" min="0.01" /></div>
      <div class="form-field"><label>Reason</label><input type="text" id="adjustReason" placeholder="e.g., Bonus, Correction, Penalty" /></div>

      <div class="modal-actions">
        <button class="modal-btn ghost" onclick="closeUserModal()">Close</button>
        <button class="modal-btn success" onclick="adjustBalance('${user.uid}')">💵 Apply</button>
      </div>

      <div class="modal-actions" style="margin-top:8px;">
        ${user.status==='suspended' 
          ? `<button class="modal-btn success" onclick="toggleSuspend('${user.uid}','active')">✅ Unsuspend User</button>`
          : `<button class="modal-btn danger" onclick="toggleSuspend('${user.uid}','suspended')">🚫 Suspend User</button>`
        }
        <a href="admin-user-detail.html?uid=${user.uid}" class="modal-btn primary" style="text-decoration:none;text-align:center;">🔍 Full Profile</a>
      </div>
    `;
  };

  window.closeUserModal = () => document.getElementById('userModal').classList.remove('show');

  // ── ADJUST BALANCE ──
  window.adjustBalance = async (uid) => {
    const action = document.getElementById('adjustAction').value;
    const amount = parseFloat(document.getElementById('adjustAmount').value);
    const reason = document.getElementById('adjustReason').value.trim();

    if (!amount || amount <= 0) { alert('Please enter a valid amount.'); return; }
    if (!reason) { alert('Please enter a reason.'); return; }

    const change = action === 'add' ? amount : -amount;
    const actionWord = action === 'add' ? 'add' : 'deduct';

    if (!confirm(`${actionWord.toUpperCase()} $${fmtUSD(amount)} ${action==='add'?'to':'from'} user wallet?\nReason: ${reason}`)) return;

    try {
      await updateDoc(doc(db, 'users', uid), { walletBalance: increment(change) });
      // Log the adjustment
      await (await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")).addDoc(
        (await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")).collection(db, 'adminLogs'),
        { userId: uid, action: actionWord, amount, reason, adminEmail: auth.currentUser?.email, createdAt: serverTimestamp() }
      );
      alert(`✅ Successfully ${actionWord}ed $${fmtUSD(amount)} ${action==='add'?'to':'from'} user wallet.`);
      closeUserModal();
      loadUsers();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  // ── SUSPEND/UNSUSPEND ──
  window.toggleSuspend = async (uid, newStatus) => {
    const msg = newStatus === 'suspended' ? 'Suspend this user? They will not be able to login or perform actions.' : 'Unsuspend this user? They will regain full access.';
    if (!confirm(msg)) return;
    try {
      await updateDoc(doc(db, 'users', uid), { status: newStatus });
      alert(`✅ User ${newStatus === 'suspended' ? 'suspended' : 'unsuspended'} successfully.`);
      closeUserModal();
      loadUsers();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  function renderUsers(users) {
    const active = users.filter(u => u.status !== 'suspended').length;
    const suspended = users.filter(u => u.status === 'suspended').length;
    document.getElementById('activeCount').textContent = active;
    document.getElementById('suspendedCount').textContent = suspended;
    document.getElementById('totalCount').textContent = users.length;

    let html = '<table><tr><th>User</th><th>Phone</th><th>Balance</th><th>Referral Code</th><th>Referred By</th><th>Status</th><th>Joined</th><th>Actions</th></tr>';
    if (users.length === 0) html += '<tr><td colspan="8"><div class="empty"><p>No users found</p></div></td></tr>';

    users.forEach(u => {
      const joinDate = u.createdAt?.toMillis ? new Date(u.createdAt.toMillis()).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' }) : '—';
      html += `<tr>
        <td><strong>${u.email||'—'}</strong><br><small style="color:var(--muted);">${(u.uid||'').substring(0,8)}...</small></td>
        <td>${u.phone||'—'}</td>
        <td style="font-weight:700;">$${fmtUSD(u.walletBalance||0)}</td>
        <td style="font-family:monospace;font-size:0.75rem;">${u.referralCode||'—'}</td>
        <td style="font-size:0.72rem;">${u.referredBy ? (u.referredBy).substring(0,8)+'...' : '—'}</td>
        <td><span class="status-pill ${u.status==='suspended'?'suspended':'active'}">${u.status||'active'}</span></td>
        <td>${joinDate}</td>
        <td>
          <button class="btn view" onclick="viewUserDetails(${JSON.stringify(u).replace(/"/g,'&quot;')})">📋 View</button>
          ${u.status==='suspended' 
            ? `<button class="btn unsuspend" onclick="toggleSuspend('${u.uid}','active')">Unblock</button>`
            : `<button class="btn suspend" onclick="toggleSuspend('${u.uid}','suspended')">Suspend</button>`
          }
          <a href="admin-user-detail.html?uid=${u.uid}" class="btn impersonate">🔍 Full</a>
        </td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('usersTable').innerHTML = html;
  }

  async function loadUsers() {
    try {
      const snap = await getDocs(query(collection(db, 'users'), orderBy('createdAt', 'desc')));
      allUsers = [];
      snap.forEach(d => { allUsers.push({ uid: d.id, ...d.data() }); });
      renderUsers(allUsers);
    } catch (err) {
      document.getElementById('usersTable').innerHTML = '<div class="empty"><p>Error loading users.</p></div>';
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user || !sessionStorage.getItem('nexa_admin_logged')) { window.location.href = 'admin-login.html'; return; }
    await loadUsers();
  });
</script>
</body>
</html>
