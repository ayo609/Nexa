<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa Admin – Withdrawals</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0f0a1e;--card:#1a1333;--sidebar:#120c24;--primary:#7c3aed;--primary-dark:#6d28d9;--primary-soft:#2d1b69;--accent:#a78bfa;--text:#f5f3ff;--muted:#9d94b8;--border:#2d1f5e;--input-bg:#1e1644;--error:#ef4444;--success:#22c55e;--warn:#f59e0b;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}

  .sidebar{width:250px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:20;overflow-y:auto;}
  .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:8px;text-decoration:none;}
  .logo-icon{width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:20px;height:20px;color:#fff;}
  .sidebar .logo span{font-size:1.1rem;font-weight:800;color:var(--text);}
  .sidebar .logo em{color:var(--accent);font-style:normal;}
  .nav-section{font-size:0.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:16px 12px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-size:0.84rem;font-weight:600;margin-bottom:2px;transition:all 0.2s;}
  .nav-item:hover{background:var(--primary-soft);color:var(--text);}
  .nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,0.3);}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;}
  .main-content{flex:1;margin-left:250px;padding:24px 28px;min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  .topbar h1{font-size:1.5rem;font-weight:800;}

  .filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-tab{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:inherit;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .filter-tab:hover{border-color:var(--primary);color:var(--text);}
  .filter-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .section-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;}
  .section-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .section-header h3{font-size:1rem;font-weight:700;}
  .count-badge{font-size:0.72rem;font-weight:700;padding:4px 12px;border-radius:50px;background:rgba(245,158,11,0.2);color:var(--warn);}

  table{width:100%;border-collapse:collapse;}
  table th{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:12px 14px;text-align:left;background:var(--input-bg);white-space:nowrap;}
  table td{font-size:0.84rem;padding:14px;border-bottom:1px solid var(--border);}
  table tr:hover{background:rgba(124,58,237,0.04);}

  .status-pill{font-size:0.66rem;font-weight:700;padding:4px 10px;border-radius:50px;display:inline-block;}
  .status-pill.pending{background:rgba(245,158,11,0.2);color:var(--warn);}
  .status-pill.approved{background:rgba(34,197,94,0.2);color:var(--success);}
  .status-pill.rejected{background:rgba(239,68,68,0.2);color:var(--error);}

  .type-badge{font-size:0.66rem;font-weight:700;padding:4px 10px;border-radius:50px;display:inline-block;}
  .type-badge.wallet{background:rgba(59,130,246,0.2);color:#60a5fa;}
  .type-badge.bank{background:rgba(124,58,237,0.2);color:var(--accent);}

  .btn{font-size:0.7rem;font-weight:700;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s;margin:2px;}
  .btn.approve{background:rgba(34,197,94,0.2);color:var(--success);}
  .btn.approve:hover{background:rgba(34,197,94,0.4);}
  .btn.reject{background:rgba(239,68,68,0.2);color:var(--error);}
  .btn.reject:hover{background:rgba(239,68,68,0.4);}
  .btn.info{background:rgba(59,130,246,0.2);color:#60a5fa;}

  .detail-row{display:flex;gap:6px;flex-wrap:wrap;}
  .detail-chip{font-size:0.68rem;padding:3px 8px;border-radius:6px;background:var(--input-bg);color:var(--muted);white-space:nowrap;}

  .loading{text-align:center;padding:60px;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{text-align:center;padding:50px;color:var(--muted);}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:550px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{font-size:1.1rem;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
  .modal h3 svg{width:20px;height:20px;color:var(--accent);}
  .modal .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
  .modal .info-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .modal .info-item .l{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .modal .info-item .v{font-size:0.88rem;font-weight:700;color:var(--text);word-break:break-all;}
  .modal .info-item.full{grid-column:1/-1;}
  .modal-actions{display:flex;gap:10px;}
  .modal-btn{flex:1;padding:13px;border:none;border-radius:12px;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .modal-btn.primary{background:var(--primary);color:#fff;}
  .modal-btn.ghost{background:var(--input-bg);color:var(--muted);border:1px solid var(--border);}

  @media(max-width:900px){.sidebar{width:65px;padding:12px 6px;}.sidebar .logo span,.nav-item span,.nav-section{display:none;}.nav-item{justify-content:center;padding:12px 8px;}.main-content{margin-left:65px;padding:16px;}table{font-size:0.75rem;}}
</style>
</head>
<body>

<aside class="sidebar">
  <a class="logo" href="admin-dashboard.html"><div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span>Nex<em>a</em> Admin</span></a>
  <div class="nav-section">Main</div>
  <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Dashboard</a>
  <div class="nav-section">Management</div>
  <a href="admin-deposits.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/></svg>Deposits</a>
  <a href="admin-withdrawals.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 010-4h12v4"/></svg>Withdrawals</a>
  <a href="admin-investments.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>Investments</a>
  <a href="admin-referrals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>Referrals</a>
  <div class="nav-section">Users</div>
  <a href="admin-users.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>All Users</a>
  <div class="nav-section">System</div>
  <a href="admin-settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  <a href="#" class="nav-item" style="color:var(--error);margin-top:auto;" onclick="adminLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/></svg>Logout</a>
</aside>

<div class="main-content">
  <div class="topbar"><h1>Withdrawal Management</h1></div>

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterWithdrawals('all', this)">All</button>
    <button class="filter-tab" onclick="filterWithdrawals('pending', this)">Pending</button>
    <button class="filter-tab" onclick="filterWithdrawals('approved', this)">Approved</button>
    <button class="filter-tab" onclick="filterWithdrawals('rejected', this)">Rejected</button>
    <button class="filter-tab" onclick="filterWithdrawals('wallet', this)">💰 USDT Wallet</button>
    <button class="filter-tab" onclick="filterWithdrawals('bank', this)">🏦 Bank Transfer</button>
  </div>

  <div class="section-card">
    <div class="section-header"><h3>Withdrawal Requests</h3><span class="count-badge" id="withCount">0 total</span></div>
    <div id="withdrawalsTable"><div class="loading"><div class="spinner"></div><p>Loading withdrawals...</p></div></div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" id="detailModalContent"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain: "nexa-a8cad.firebaseapp.com", projectId: "nexa-a8cad", storageBucket: "nexa-a8cad.firebasestorage.app", messagingSenderId: "324559998149", appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const fmtUSD = n => (n||0).toFixed(2);
  const fmt = n => Math.round(n||0).toLocaleString();
  let allWithdrawals = [];
  let currentFilter = 'all';

  window.adminLogout = async () => { sessionStorage.removeItem('nexa_admin_logged'); await signOut(auth); window.location.href = 'admin-login.html'; };

  window.filterWithdrawals = (filter, btn) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderWithdrawals();
  };

  window.viewDetails = (withdrawal) => {
    const isWallet = withdrawal.type === 'wallet';
    const modal = document.getElementById('detailModalContent');
    const date = withdrawal.createdAt?.toMillis ? new Date(withdrawal.createdAt.toMillis()).toLocaleString('en-US', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '—';
    
    modal.innerHTML = `
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>Withdrawal Details</h3>
      <div class="info-grid">
        <div class="info-item"><div class="l">User Email</div><div class="v">${withdrawal.userEmail||'—'}</div></div>
        <div class="info-item"><div class="l">User ID</div><div class="v" style="font-size:0.7rem;font-family:monospace;">${withdrawal.userId||'—'}</div></div>
        <div class="info-item"><div class="l">Type</div><div class="v">${isWallet ? '💰 USDT Wallet (BEP20)' : '🏦 Bank Transfer'}</div></div>
        <div class="info-item"><div class="l">Status</div><div class="v"><span class="status-pill ${withdrawal.status}">${withdrawal.status}</span></div></div>
        <div class="info-item"><div class="l">Amount (USDT)</div><div class="v">$${fmtUSD(withdrawal.amount)}</div></div>
        <div class="info-item"><div class="l">Charge (15%)</div><div class="v">-$${fmtUSD(withdrawal.charge)}</div></div>
        <div class="info-item"><div class="l">Net Amount</div><div class="v" style="color:var(--success);">$${fmtUSD(withdrawal.netAmount)} USDT</div></div>
        ${!isWallet ? `<div class="info-item"><div class="l">Naira Equivalent</div><div class="v">₦${fmt(withdrawal.nairaNetAmount||(withdrawal.netAmount*1370))}</div></div>` : ''}
        ${isWallet ? `
          <div class="info-item full"><div class="l">Wallet Address (BEP20)</div><div class="v" style="font-family:monospace;font-size:0.78rem;">${withdrawal.walletAddress||'—'}</div></div>
          <div class="info-item"><div class="l">Network</div><div class="v">${withdrawal.network||'BEP20'}</div></div>
        ` : `
          <div class="info-item"><div class="l">Bank Name</div><div class="v">${withdrawal.bankName||'—'}</div></div>
          <div class="info-item"><div class="l">Account Number</div><div class="v">${withdrawal.accountNumber||'—'}</div></div>
          <div class="info-item full"><div class="l">Account Name</div><div class="v">${withdrawal.accountName||'—'}</div></div>
          <div class="info-item"><div class="l">Exchange Rate</div><div class="v">₦${fmt(withdrawal.usdRate||1370)}/$</div></div>
        `}
        <div class="info-item full"><div class="l">Requested At</div><div class="v">${date}</div></div>
      </div>
      ${withdrawal.status === 'pending' ? `
        <div class="modal-actions">
          <button class="modal-btn ghost" onclick="closeDetailModal()">Close</button>
          <button class="modal-btn primary" style="background:var(--success);" onclick="approveWithdrawal('${withdrawal.id}')">✅ Approve</button>
          <button class="modal-btn primary" style="background:var(--error);" onclick="rejectWithdrawal('${withdrawal.id}','${withdrawal.userId}',${withdrawal.amount})">❌ Reject & Refund</button>
        </div>
      ` : `
        <div class="modal-actions"><button class="modal-btn primary" onclick="closeDetailModal()">Close</button></div>
      `}
    `;
    document.getElementById('detailModal').classList.add('show');
  };

  window.closeDetailModal = () => document.getElementById('detailModal').classList.remove('show');

  window.approveWithdrawal = async (withId) => {
    if (!confirm('Approve this withdrawal?')) return;
    await updateDoc(doc(db, 'withdrawals', withId), { status: 'approved', approvedAt: serverTimestamp() });
    alert('Withdrawal approved!');
    closeDetailModal();
    loadWithdrawals();
  };

  window.rejectWithdrawal = async (withId, userId, amount) => {
    if (!confirm(`Reject and refund $${fmtUSD(amount)} to user?`)) return;
    await updateDoc(doc(db, 'withdrawals', withId), { status: 'rejected' });
    await updateDoc(doc(db, 'users', userId), { walletBalance: increment(amount) });
    alert('Withdrawal rejected. Amount refunded to user wallet.');
    closeDetailModal();
    loadWithdrawals();
  };

  function renderWithdrawals() {
    let filtered = allWithdrawals;
    if (currentFilter === 'pending') filtered = allWithdrawals.filter(w => w.status === 'pending');
    else if (currentFilter === 'approved') filtered = allWithdrawals.filter(w => w.status === 'approved');
    else if (currentFilter === 'rejected') filtered = allWithdrawals.filter(w => w.status === 'rejected');
    else if (currentFilter === 'wallet') filtered = allWithdrawals.filter(w => w.type === 'wallet');
    else if (currentFilter === 'bank') filtered = allWithdrawals.filter(w => w.type === 'bank' || !w.type);

    document.getElementById('withCount').textContent = filtered.length + ' total';

    let html = '<table><tr><th>User</th><th>Type</th><th>Amount</th><th>Charge</th><th>Net</th><th>Details</th><th>Status</th><th>Date</th><th>Actions</th></tr>';
    if (filtered.length === 0) html += '<tr><td colspan="9"><div class="empty"><p>No withdrawals found</p></div></td></tr>';
    
    filtered.forEach(w => {
      const isWallet = w.type === 'wallet';
      const date = w.createdAt?.toMillis ? new Date(w.createdAt.toMillis()).toLocaleString('en-US', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
      const details = isWallet ? `${w.walletAddress?.substring(0,10)||'—'}...` : `${w.bankName||'—'}<br><small>${w.accountNumber?.slice(-4)||'—'}</small>`;
      
      html += `<tr>
        <td><strong>${w.userEmail||'—'}</strong><br><small style="color:var(--muted);">${(w.userId||'').substring(0,8)}...</small></td>
        <td><span class="type-badge ${isWallet?'wallet':'bank'}">${isWallet?'💳 Wallet':'🏦 Bank'}</span></td>
        <td>$${fmtUSD(w.amount)}</td>
        <td style="color:var(--error);">-$${fmtUSD(w.charge)}</td>
        <td style="color:var(--success);">$${fmtUSD(w.netAmount)}</td>
        <td><div class="detail-row">${isWallet ? `<span class="detail-chip">BEP20</span><span class="detail-chip">${(w.walletAddress||'').substring(0,14)}...</span>` : `<span class="detail-chip">${w.bankName||'—'}</span><span class="detail-chip">Acct: ${w.accountNumber||'—'}</span><span class="detail-chip">${w.accountName||'—'}</span>`}</div></td>
        <td><span class="status-pill ${w.status}">${w.status}</span></td>
        <td>${date}</td>
        <td>
          <button class="btn info" onclick="viewDetails(${JSON.stringify(w).replace(/"/g,'&quot;')})">View</button>
          ${w.status==='pending'?`<button class="btn approve" onclick="approveWithdrawal('${w.id}')">✓</button><button class="btn reject" onclick="rejectWithdrawal('${w.id}','${w.userId}',${w.amount})">✗</button>`:''}
        </td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('withdrawalsTable').innerHTML = html;
  }

  async function loadWithdrawals() {
    const snap = await getDocs(query(collection(db, 'withdrawals'), orderBy('createdAt', 'desc')));
    allWithdrawals = [];
    snap.forEach(d => { allWithdrawals.push({ id: d.id, ...d.data() }); });
    renderWithdrawals();
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user || !sessionStorage.getItem('nexa_admin_logged')) { window.location.href = 'admin-login.html'; return; }
    await loadWithdrawals();
  });

  // Fix viewDetails to use object reference
  window.viewDetailsByIndex = (index) => {
    let filtered = allWithdrawals;
    if (currentFilter === 'pending') filtered = allWithdrawals.filter(w => w.status === 'pending');
    else if (currentFilter === 'approved') filtered = allWithdrawals.filter(w => w.status === 'approved');
    else if (currentFilter === 'rejected') filtered = allWithdrawals.filter(w => w.status === 'rejected');
    else if (currentFilter === 'wallet') filtered = allWithdrawals.filter(w => w.type === 'wallet');
    else if (currentFilter === 'bank') filtered = allWithdrawals.filter(w => w.type === 'bank' || !w.type);
    viewDetails(filtered[index]);
  };
</script>
</body>
</html>
