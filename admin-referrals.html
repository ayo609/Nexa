<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa Admin – Referrals</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0f0a1e;--card:#1a1333;--sidebar:#120c24;--primary:#7c3aed;--primary-dark:#6d28d9;--primary-soft:#2d1b69;--accent:#a78bfa;--text:#f5f3ff;--muted:#9d94b8;--border:#2d1f5e;--input-bg:#1e1644;--error:#ef4444;--success:#22c55e;--warn:#f59e0b;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}

  .sidebar{width:250px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:20;overflow-y:auto;}
  .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:8px;text-decoration:none;}
  .logo-icon{width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:20px;height:20px;color:#fff;}
  .sidebar .logo span{font-size:1.1rem;font-weight:800;color:var(--text);}
  .sidebar .logo em{color:var(--accent);font-style:normal;}
  .nav-section{font-size:0.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:16px 12px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-size:0.84rem;font-weight:600;margin-bottom:2px;transition:all 0.2s;}
  .nav-item:hover{background:var(--primary-soft);color:var(--text);}
  .nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,0.3);}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;}
  .main-content{flex:1;margin-left:250px;padding:24px 28px;min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:1.5rem;font-weight:800;}

  .stats-mini{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-mini{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;}
  .stat-mini .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .stat-mini .dot.purple{background:var(--primary);}
  .stat-mini .dot.green{background:var(--success);}
  .stat-mini .dot.amber{background:var(--warn);}
  .stat-mini span{font-size:0.82rem;font-weight:600;}

  .filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-tab{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:inherit;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .filter-tab:hover{border-color:var(--primary);color:var(--text);}
  .filter-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .section-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;}
  .section-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .section-header h3{font-size:1rem;font-weight:700;}
  .count-badge{font-size:0.72rem;font-weight:700;padding:4px 12px;border-radius:50px;background:rgba(124,58,237,0.2);color:var(--accent);}

  table{width:100%;border-collapse:collapse;}
  table th{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:12px 14px;text-align:left;background:var(--input-bg);white-space:nowrap;}
  table td{font-size:0.84rem;padding:12px 14px;border-bottom:1px solid var(--border);}
  table tr:hover{background:rgba(124,58,237,0.04);}

  .level-badge{font-size:0.66rem;font-weight:700;padding:4px 10px;border-radius:50px;display:inline-block;}
  .level-badge.l1{background:rgba(124,58,237,0.2);color:var(--accent);}
  .level-badge.l2{background:rgba(167,139,250,0.2);color:#c4b5fd;}
  .level-badge.l3{background:rgba(196,181,253,0.15);color:#ddd6fe;}

  .btn{font-size:0.7rem;font-weight:700;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s;margin:2px;text-decoration:none;display:inline-block;}
  .btn.view{background:rgba(59,130,246,0.2);color:#60a5fa;}
  .btn.view:hover{background:rgba(59,130,246,0.4);}

  .loading{text-align:center;padding:60px;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{text-align:center;padding:50px;color:var(--muted);}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{font-size:1.1rem;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
  .modal h3 svg{width:20px;height:20px;color:var(--accent);}
  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .info-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;}
  .info-item .l{font-size:0.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .info-item .v{font-size:0.85rem;font-weight:700;color:var(--text);word-break:break-all;}
  .info-item.full{grid-column:1/-1;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-btn{flex:1;padding:12px;border:none;border-radius:12px;font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .modal-btn.primary{background:var(--primary);color:#fff;}
  .modal-btn.ghost{background:var(--input-bg);color:var(--muted);border:1px solid var(--border);}

  /* TREE VIEW */
  .tree-container{background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
  .tree-title{font-size:0.8rem;font-weight:700;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .tree-level{margin-bottom:12px;padding-left:16px;border-left:2px solid var(--border);}
  .tree-level.l1{border-left-color:var(--primary);}
  .tree-level.l2{border-left-color:var(--accent);}
  .tree-level.l3{border-left-color:#c4b5fd;}
  .tree-user{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:0.8rem;}
  .tree-user .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .tree-user .dot.l1{background:var(--primary);}
  .tree-user .dot.l2{background:var(--accent);}
  .tree-user .dot.l3{background:#c4b5fd;}

  @media(max-width:900px){.sidebar{width:65px;padding:12px 6px;}.sidebar .logo span,.nav-item span,.nav-section{display:none;}.nav-item{justify-content:center;padding:12px 8px;}.main-content{margin-left:65px;padding:16px;}.info-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<aside class="sidebar">
  <a class="logo" href="admin-dashboard.html"><div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span>Nex<em>a</em> Admin</span></a>
  <div class="nav-section">Main</div>
  <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Dashboard</a>
  <div class="nav-section">Management</div>
  <a href="admin-deposits.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/></svg>Deposits</a>
  <a href="admin-withdrawals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 010-4h12v4"/></svg>Withdrawals</a>
  <a href="admin-investments.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>Investments</a>
  <a href="admin-referrals.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>Referrals</a>
  <div class="nav-section">Users</div>
  <a href="admin-users.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>All Users</a>
  <div class="nav-section">System</div>
  <a href="admin-settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  <a href="#" class="nav-item" style="color:var(--error);margin-top:auto;" onclick="adminLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/></svg>Logout</a>
</aside>

<div class="main-content">
  <div class="topbar"><h1>Referral Management</h1></div>

  <div class="stats-mini">
    <div class="stat-mini"><div class="dot purple"></div><span>Total Referrals: <strong id="totalRefs">0</strong></span></div>
    <div class="stat-mini"><div class="dot green"></div><span>Total Bonuses Paid: <strong id="totalBonuses">$0.00</strong></span></div>
    <div class="stat-mini"><div class="dot amber"></div><span>Level 1 (10%): <strong id="l1Count">0</strong></span></div>
    <div class="stat-mini"><span>L2 (2%): <strong id="l2Count">0</strong></span></div>
    <div class="stat-mini"><span>L3 (1%): <strong id="l3Count">0</strong></span></div>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterReferrals('all', this)">All Referrals</button>
    <button class="filter-tab" onclick="filterReferrals('l1', this)">Level 1 (10%)</button>
    <button class="filter-tab" onclick="filterReferrals('l2', this)">Level 2 (2%)</button>
    <button class="filter-tab" onclick="filterReferrals('l3', this)">Level 3 (1%)</button>
  </div>

  <div class="section-card">
    <div class="section-header"><h3>Referral Bonus Logs</h3><span class="count-badge" id="refCount">0 entries</span></div>
    <div id="referralsTable"><div class="loading"><div class="spinner"></div><p>Loading referrals...</p></div></div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" id="detailModalContent"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, getDocs, doc, getDoc, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain: "nexa-a8cad.firebaseapp.com", projectId: "nexa-a8cad", storageBucket: "nexa-a8cad.firebasestorage.app", messagingSenderId: "324559998149", appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const fmtUSD = n => (n||0).toFixed(2);
  let allReferrals = [];
  let currentFilter = 'all';

  window.adminLogout = async () => { sessionStorage.removeItem('nexa_admin_logged'); await signOut(auth); window.location.href = 'admin-login.html'; };

  window.filterReferrals = (filter, btn) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderReferrals();
  };

  // ── VIEW REFERRAL DETAILS WITH TREE ──
  window.viewReferralDetails = async (ref) => {
    const modal = document.getElementById('detailModalContent');
    modal.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading details...</p></div>';
    document.getElementById('detailModal').classList.add('show');

    const date = ref.createdAt?.toMillis ? new Date(ref.createdAt.toMillis()).toLocaleString('en-US', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';

    // Fetch user details
    let uplineEmail = '—', downlineEmail = '—';
    try {
      const [upSnap, downSnap] = await Promise.all([
        getDoc(doc(db, 'users', ref.uplineId)),
        getDoc(doc(db, 'users', ref.fromUserId))
      ]);
      if (upSnap.exists()) uplineEmail = upSnap.data().email || '—';
      if (downSnap.exists()) downlineEmail = downSnap.data().email || '—';
    } catch {}

    // Build tree
    let treeHtml = '';
    try {
      const l1Snap = await getDocs(query(collection(db, 'users'), where('referredBy', '==', ref.uplineId)));
      treeHtml += `<div class="tree-level l1"><div class="tree-title">Level 1 Referrals (${l1Snap.size})</div>`;
      for (const d of l1Snap.docs) {
        const u = d.data();
        treeHtml += `<div class="tree-user"><div class="dot l1"></div>${u.email||d.id.substring(0,8)} — $${fmtUSD(u.walletBalance||0)}</div>`;
        
        const l2Snap = await getDocs(query(collection(db, 'users'), where('referredBy', '==', d.id)));
        if (!l2Snap.empty) {
          treeHtml += `<div class="tree-level l2"><div class="tree-title" style="font-size:0.7rem;">Level 2 (${l2Snap.size})</div>`;
          for (const d2 of l2Snap.docs) {
            const u2 = d2.data();
            treeHtml += `<div class="tree-user"><div class="dot l2"></div>${u2.email||d2.id.substring(0,8)} — $${fmtUSD(u2.walletBalance||0)}</div>`;
          }
          treeHtml += `</div>`;
        }
      }
      treeHtml += `</div>`;
    } catch {}

    modal.innerHTML = `
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Referral Details</h3>
      <div class="info-grid">
        <div class="info-item"><div class="l">Level</div><div class="v"><span class="level-badge l${ref.level||1}">Level ${ref.level||1} · ${((ref.rate||0)*100).toFixed(0)}%</span></div></div>
        <div class="info-item"><div class="l">Bonus Amount</div><div class="v" style="color:var(--success);">$${fmtUSD(ref.bonus)}</div></div>
        <div class="info-item"><div class="l">Plan Amount</div><div class="v">$${fmtUSD(ref.planAmount)}</div></div>
        <div class="info-item"><div class="l">Plan Name</div><div class="v">${ref.planName||'—'}</div></div>
        <div class="info-item full"><div class="l">Upline (Earner)</div><div class="v">${uplineEmail}<br><small style="font-family:monospace;">${ref.uplineId||'—'}</small></div></div>
        <div class="info-item full"><div class="l">Downline (Purchaser)</div><div class="v">${downlineEmail}<br><small style="font-family:monospace;">${ref.fromUserId||'—'}</small></div></div>
        <div class="info-item full"><div class="l">Date</div><div class="v">${date}</div></div>
      </div>

      <div class="tree-container">${treeHtml || '<p style="color:var(--muted);text-align:center;">No network data available</p>'}</div>

      <div class="modal-actions">
        <button class="modal-btn primary" onclick="closeDetailModal()">Close</button>
        <button class="modal-btn ghost" onclick="window.open('admin-user-detail.html?uid=${ref.uplineId}','_blank')">👤 View Upline</button>
        <button class="modal-btn ghost" onclick="window.open('admin-user-detail.html?uid=${ref.fromUserId}','_blank')">👤 View Downline</button>
      </div>
    `;
  };

  window.closeDetailModal = () => document.getElementById('detailModal').classList.remove('show');

  function renderReferrals() {
    let filtered = allReferrals;
    if (currentFilter === 'l1') filtered = allReferrals.filter(r => r.level === 1);
    else if (currentFilter === 'l2') filtered = allReferrals.filter(r => r.level === 2);
    else if (currentFilter === 'l3') filtered = allReferrals.filter(r => r.level === 3);

    const totalBonuses = allReferrals.reduce((sum, r) => sum + (r.bonus||0), 0);
    const l1Count = allReferrals.filter(r => r.level === 1).length;
    const l2Count = allReferrals.filter(r => r.level === 2).length;
    const l3Count = allReferrals.filter(r => r.level === 3).length;

    document.getElementById('totalRefs').textContent = allReferrals.length;
    document.getElementById('totalBonuses').textContent = '$' + fmtUSD(totalBonuses);
    document.getElementById('l1Count').textContent = l1Count;
    document.getElementById('l2Count').textContent = l2Count;
    document.getElementById('l3Count').textContent = l3Count;
    document.getElementById('refCount').textContent = filtered.length + ' entries';

    let html = '<table><tr><th>Level</th><th>Bonus</th><th>Plan Amount</th><th>Plan</th><th>Upline</th><th>Downline</th><th>Date</th><th>Actions</th></tr>';
    if (filtered.length === 0) html += '<tr><td colspan="8"><div class="empty"><p>No referral records found</p></div></td></tr>';

    filtered.forEach(ref => {
      const date = ref.createdAt?.toMillis ? new Date(ref.createdAt.toMillis()).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
      html += `<tr>
        <td><span class="level-badge l${ref.level||1}">L${ref.level||1} · ${((ref.rate||0)*100).toFixed(0)}%</span></td>
        <td style="color:var(--success);font-weight:700;">$${fmtUSD(ref.bonus)}</td>
        <td>$${fmtUSD(ref.planAmount)}</td>
        <td>${ref.planName||'—'}</td>
        <td style="font-size:0.7rem;">${(ref.uplineId||'').substring(0,8)}...</td>
        <td style="font-size:0.7rem;">${(ref.fromUserId||'').substring(0,8)}...</td>
        <td>${date}</td>
        <td><button class="btn view" onclick="viewReferralDetails(${JSON.stringify(ref).replace(/"/g,'&quot;')})">📋 View</button></td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('referralsTable').innerHTML = html;
  }

  async function loadReferrals() {
    try {
      const snap = await getDocs(query(collection(db, 'referralLogs'), orderBy('createdAt', 'desc')));
      allReferrals = [];
      snap.forEach(d => { allReferrals.push({ id: d.id, ...d.data() }); });
      renderReferrals();
    } catch (err) {
      document.getElementById('referralsTable').innerHTML = '<div class="empty"><p>Error loading referrals.</p></div>';
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user || !sessionStorage.getItem('nexa_admin_logged')) { window.location.href = 'admin-login.html'; return; }
    await loadReferrals();
  });
</script>
</body>
</html>
