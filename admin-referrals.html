<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>QUANTUM Admin – Referrals</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0a0e27;--card:#131837;--sidebar:#0d1226;--primary:#00d4ff;--accent:#7c3aed;
    --primary-soft:rgba(0,212,255,0.15);--text:#e8ecf7;--muted:#8892b0;
    --border:rgba(232,236,247,0.1);--input-bg:#1a1f42;--error:#ef4444;--success:#10b981;
    --warn:#f59e0b;--gold:#fbbf24;
  }
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}

  .sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:20;overflow-y:auto;}
  .sidebar .logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding:8px;text-decoration:none;}
  .logo-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:22px;height:22px;color:#fff;}
  .sidebar .logo span{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--text);}
  .sidebar .logo em{color:var(--primary);font-style:normal;}
  .nav-section{font-size:0.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:16px 12px 8px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:0.85rem;font-weight:600;margin-bottom:3px;transition:all 0.2s;}
  .nav-item:hover{background:var(--primary-soft);color:var(--text);}
  .nav-item.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 4px 15px rgba(0,212,255,0.3);}
  .nav-item svg{width:20px;height:20px;flex-shrink:0;}
  .main-content{flex:1;margin-left:260px;padding:28px 32px;min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:14px;}
  .topbar h1{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;}

  .stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 16px;text-align:center;transition:all 0.3s;}
  .stat-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,212,255,0.1);}
  .stat-card .stat-icon{font-size:24px;margin-bottom:8px;}
  .stat-card .stat-value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--text);}
  .stat-card .stat-label{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;font-weight:600;}

  .filter-tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .filter-tab{padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.3s;}
  .filter-tab:hover{border-color:var(--primary);color:var(--text);}
  .filter-tab.active{background:linear-gradient(135deg,var(--primary),var(--accent));border-color:var(--primary);color:#fff;box-shadow:0 4px 15px rgba(0,212,255,0.3);}

  .section-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:24px;}
  .section-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .section-header h3{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;}
  .count-badge{font-size:0.72rem;font-weight:700;padding:5px 14px;border-radius:50px;background:var(--primary-soft);color:var(--primary);}

  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  table th{font-size:0.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:14px 16px;text-align:left;background:var(--input-bg);white-space:nowrap;border-bottom:1px solid var(--border);}
  table td{font-size:0.84rem;padding:14px 16px;border-bottom:1px solid var(--border);}
  table tbody tr{transition:all 0.2s;}
  table tbody tr:hover{background:rgba(0,212,255,0.03);}

  .level-badge{font-size:0.68rem;font-weight:700;padding:5px 12px;border-radius:50px;display:inline-block;font-family:'Space Grotesk',sans-serif;}
  .level-badge.l1{background:rgba(0,212,255,0.2);color:var(--primary);}
  .level-badge.l2{background:rgba(124,58,237,0.2);color:#a78bfa;}
  .level-badge.l3{background:rgba(16,185,129,0.2);color:var(--success);}

  .btn{font-size:0.72rem;font-weight:700;padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn.view{background:rgba(0,212,255,0.15);color:var(--primary);}
  .btn.view:hover{background:rgba(0,212,255,0.25);transform:translateY(-1px);}

  .loading{text-align:center;padding:60px;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{text-align:center;padding:50px;color:var(--muted);}
  .empty .empty-icon{font-size:40px;margin-bottom:12px;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,3,10,0.85);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:650px;width:100%;max-height:85vh;overflow-y:auto;animation:modalPop 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);}
  @keyframes modalPop{from{opacity:0;transform:scale(0.9) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal h3{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .modal h3 svg{width:22px;height:22px;color:var(--primary);}
  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
  .info-item{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;}
  .info-item .l{font-size:0.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;font-weight:700;}
  .info-item .v{font-size:0.88rem;font-weight:600;color:var(--text);word-break:break-all;font-family:'JetBrains Mono',monospace;}
  .info-item.full{grid-column:1/-1;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-btn{flex:1;padding:13px;border:none;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .modal-btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;}
  .modal-btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,212,255,0.3);}
  .modal-btn.ghost{background:var(--input-bg);color:var(--muted);border:1px solid var(--border);}
  .modal-btn.ghost:hover{background:var(--border);color:var(--text);}

  .tree-container{background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
  .tree-title{font-size:0.78rem;font-weight:700;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .tree-level{margin-bottom:10px;padding-left:16px;border-left:2px solid var(--border);}
  .tree-level.l1{border-left-color:var(--primary);}
  .tree-level.l2{border-left-color:var(--accent);}
  .tree-level.l3{border-left-color:var(--success);}
  .tree-user{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:0.8rem;}
  .tree-user .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .tree-user .dot.l1{background:var(--primary);}
  .tree-user .dot.l2{background:var(--accent);}
  .tree-user .dot.l3{background:var(--success);}

  @media(max-width:900px){.sidebar{width:65px;padding:14px 8px;}.sidebar .logo span,.nav-item span,.nav-section{display:none;}.nav-item{justify-content:center;padding:12px 8px;}.main-content{margin-left:65px;padding:18px;}.stats-grid{grid-template-columns:repeat(2,1fr);}.info-grid{grid-template-columns:1fr;}}
  @media(max-width:600px){.stats-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<aside class="sidebar">
  <a class="logo" href="admin-dashboard.html">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <span>QUANT<em>UM</em> Admin</span>
  </a>
  <div class="nav-section">Main</div>
  <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span>Dashboard</span></a>
  <div class="nav-section">Management</div>
  <a href="admin-deposits.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19,12 12,19 5,12"/></svg><span>Deposits</span></a>
  <a href="admin-withdrawals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5,12 12,5 19,12"/></svg><span>Withdrawals</span></a>
  <a href="admin-investments.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg><span>Investments</span></a>
  <a href="admin-referrals.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17,11 19,13 23,9"/></svg><span>Referrals</span></a>
  <div class="nav-section">Users</div>
  <a href="admin-users.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>All Users</span></a>
  <div class="nav-section">System</div>
  <a href="admin-settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></a>
  <a href="#" class="nav-item" style="color:var(--error);margin-top:auto;" onclick="adminLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 01 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Logout</span></a>
</aside>

<div class="main-content">
  <div class="topbar"><h1>📊 Referral Management</h1></div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value" id="totalRefs">0</div><div class="stat-label">Total Referrals</div></div>
    <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" id="totalBonuses">₦0</div><div class="stat-label">Total Bonuses</div></div>
    <div class="stat-card"><div class="stat-icon" style="color:var(--primary);">🔷</div><div class="stat-value" id="l1Count">0</div><div class="stat-label">Level 1 (10%)</div></div>
    <div class="stat-card"><div class="stat-icon" style="color:var(--accent);">🟣</div><div class="stat-value" id="l2Count">0</div><div class="stat-label">Level 2 (5%)</div></div>
    <div class="stat-card"><div class="stat-icon" style="color:var(--success);">🟢</div><div class="stat-value" id="l3Count">0</div><div class="stat-label">Level 3 (2%)</div></div>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterReferrals('all', this)">📋 All</button>
    <button class="filter-tab" onclick="filterReferrals('l1', this)">🔷 L1 (10%)</button>
    <button class="filter-tab" onclick="filterReferrals('l2', this)">🟣 L2 (5%)</button>
    <button class="filter-tab" onclick="filterReferrals('l3', this)">🟢 L3 (2%)</button>
  </div>

  <div class="section-card">
    <div class="section-header"><h3>Referral Bonus Logs</h3><span class="count-badge" id="refCount">0 entries</span></div>
    <div class="table-wrap" id="referralsTable"><div class="loading"><div class="spinner"></div><p>Loading referrals...</p></div></div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" id="detailModalContent"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, getDoc, where, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // YOUR Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyDs5w4DtbEOE1mthVxvSW-DZKKhfAORdxI",
    authDomain: "affiliate-93bc0.firebaseapp.com",
    projectId: "affiliate-93bc0",
    storageBucket: "affiliate-93bc0.firebasestorage.app",
    messagingSenderId: "205243273094",
    appId: "1:205243273094:web:d45f306bdc10a69062a607"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const formatNaira = n => "₦" + (Number(n) || 0).toLocaleString("en-NG");
  let allReferrals = [];
  let currentFilter = 'all';

  window.adminLogout = async () => {
    sessionStorage.removeItem('quantum_admin_logged');
    await signOut(auth);
    window.location.href = 'admin-login.html';
  };

  window.filterReferrals = (filter, btn) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderReferrals();
  };

  window.viewReferralDetails = async (ref) => {
    const modal = document.getElementById('detailModalContent');
    modal.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading details...</p></div>';
    document.getElementById('detailModal').classList.add('show');

    const date = ref.createdAt?.toMillis ? new Date(ref.createdAt.toMillis()).toLocaleString('en-NG', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';

    let uplineInfo = '—', downlineInfo = '—';
    try {
      const [upSnap, downSnap] = await Promise.all([
        getDoc(doc(db, 'users', ref.uplineId || '')),
        getDoc(doc(db, 'users', ref.fromUserId || ''))
      ]);
      if (upSnap.exists()) { const u = upSnap.data(); uplineInfo = `${u.name||'N/A'} (@${u.username||'N/A'})`; }
      if (downSnap.exists()) { const d = downSnap.data(); downlineInfo = `${d.name||'N/A'} (@${d.username||'N/A'})`; }
    } catch(e) {}

    let treeHtml = '';
    try {
      const uplineId = ref.uplineId || '';
      if (uplineId) {
        const l1Snap = await getDocs(query(collection(db, 'users'), where('referredBy', '==', uplineId)));
        treeHtml += `<div class="tree-level l1"><div class="tree-title">Level 1 Referrals (${l1Snap.size})</div>`;
        for (const d of l1Snap.docs) {
          const u = d.data();
          treeHtml += `<div class="tree-user"><div class="dot l1"></div>${u.name||u.username||d.id.substring(0,8)} — ${formatNaira(u.balance||0)}</div>`;
          const l2Snap = await getDocs(query(collection(db, 'users'), where('referredBy', '==', d.id)));
          if (!l2Snap.empty) {
            treeHtml += `<div class="tree-level l2"><div class="tree-title">Level 2 (${l2Snap.size})</div>`;
            for (const d2 of l2Snap.docs) {
              const u2 = d2.data();
              treeHtml += `<div class="tree-user"><div class="dot l2"></div>${u2.name||u2.username||d2.id.substring(0,8)} — ${formatNaira(u2.balance||0)}</div>`;
            }
            treeHtml += `</div>`;
          }
        }
        treeHtml += `</div>`;
      }
    } catch(e) { treeHtml = '<p style="color:var(--muted);">Could not load network tree</p>'; }

    modal.innerHTML = `
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17,11 19,13 23,9"/></svg>Referral Details</h3>
      <div class="info-grid">
        <div class="info-item"><div class="l">Level</div><div class="v"><span class="level-badge l${ref.level||1}">Level ${ref.level||1} · ${((ref.rate||0)*100).toFixed(0)}%</span></div></div>
        <div class="info-item"><div class="l">Bonus Amount</div><div class="v" style="color:var(--success);">${formatNaira(ref.bonus)}</div></div>
        <div class="info-item"><div class="l">Plan Amount</div><div class="v">${formatNaira(ref.planAmount)}</div></div>
        <div class="info-item"><div class="l">Plan Name</div><div class="v">${ref.planName||'—'}</div></div>
        <div class="info-item full"><div class="l">Upline (Earner)</div><div class="v">${uplineInfo}<br><small>${ref.uplineId||'—'}</small></div></div>
        <div class="info-item full"><div class="l">Downline (Purchaser)</div><div class="v">${downlineInfo}<br><small>${ref.fromUserId||'—'}</small></div></div>
        <div class="info-item full"><div class="l">Date</div><div class="v">${date}</div></div>
      </div>
      <div class="tree-container">${treeHtml}</div>
      <div class="modal-actions">
        <button class="modal-btn primary" onclick="closeDetailModal()">Close</button>
        <button class="modal-btn ghost" onclick="window.open('admin-user-detail.html?uid=${ref.uplineId}','_blank')">👤 View Upline</button>
        <button class="modal-btn ghost" onclick="window.open('admin-user-detail.html?uid=${ref.fromUserId}','_blank')">👤 View Downline</button>
      </div>
    `;
  };

  window.closeDetailModal = () => document.getElementById('detailModal').classList.remove('show');
  document.getElementById('detailModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('show'); });

  function renderReferrals() {
    let filtered = allReferrals;
    if (currentFilter === 'l1') filtered = allReferrals.filter(r => r.level === 1);
    else if (currentFilter === 'l2') filtered = allReferrals.filter(r => r.level === 2);
    else if (currentFilter === 'l3') filtered = allReferrals.filter(r => r.level === 3);

    const totalBonuses = allReferrals.reduce((sum, r) => sum + (r.bonus || 0), 0);
    document.getElementById('totalRefs').textContent = allReferrals.length;
    document.getElementById('totalBonuses').textContent = formatNaira(totalBonuses);
    document.getElementById('l1Count').textContent = allReferrals.filter(r => r.level === 1).length;
    document.getElementById('l2Count').textContent = allReferrals.filter(r => r.level === 2).length;
    document.getElementById('l3Count').textContent = allReferrals.filter(r => r.level === 3).length;
    document.getElementById('refCount').textContent = filtered.length + ' entries';

    let html = '<table><thead><tr><th>Level</th><th>Bonus</th><th>Plan Amount</th><th>Plan</th><th>Upline</th><th>Downline</th><th>Date</th><th>Actions</th></tr></thead><tbody>';
    if (filtered.length === 0) {
      html += '<tr><td colspan="8"><div class="empty"><div class="empty-icon">📋</div><p>No referral records found</p></div></td></tr>';
    } else {
      filtered.forEach(ref => {
        const date = ref.createdAt?.toMillis ? new Date(ref.createdAt.toMillis()).toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
        const refStr = JSON.stringify(ref).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        html += `<tr>
          <td><span class="level-badge l${ref.level||1}">L${ref.level||1} · ${((ref.rate||0)*100).toFixed(0)}%</span></td>
          <td style="color:var(--success);font-weight:700;">${formatNaira(ref.bonus)}</td>
          <td>${formatNaira(ref.planAmount)}</td>
          <td>${ref.planName||'—'}</td>
          <td style="font-size:0.72rem;font-family:'JetBrains Mono',monospace;">${(ref.uplineId||'').substring(0,10)}...</td>
          <td style="font-size:0.72rem;font-family:'JetBrains Mono',monospace;">${(ref.fromUserId||'').substring(0,10)}...</td>
          <td>${date}</td>
          <td><button class="btn view" onclick="viewReferralDetails(${refStr})">📋 View</button></td>
        </tr>`;
      });
    }
    html += '</tbody></table>';
    document.getElementById('referralsTable').innerHTML = html;
  }

  async function loadReferrals() {
    try {
      const usersSnap = await getDocs(collection(db, 'users'));
      allReferrals = [];
      
      for (const userDoc of usersSnap.docs) {
        const userData = userDoc.data();
        if (userData.referralEarnings > 0 && userData.referredBy) {
          const bonus = Math.round((userData.totalInvested || 0) * 0.10);
          allReferrals.push({
            id: userDoc.id + '_ref',
            level: 1,
            rate: 0.10,
            bonus: bonus || userData.referralEarnings || 0,
            planAmount: userData.totalInvested || 0,
            planName: 'Investment',
            uplineId: userData.referredBy || '',
            fromUserId: userDoc.id,
            createdAt: userData.createdAt || new Date()
          });
        }
      }
      
      allReferrals.sort((a, b) => {
        const dateA = a.createdAt?.toMillis ? a.createdAt.toMillis() : new Date(a.createdAt).getTime();
        const dateB = b.createdAt?.toMillis ? b.createdAt.toMillis() : new Date(b.createdAt).getTime();
        return dateB - dateA;
      });
      
      renderReferrals();
    } catch (err) {
      console.error("Load error:", err);
      document.getElementById('referralsTable').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Error loading referrals. Check console.</p></div>';
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user || !sessionStorage.getItem('quantum_admin_logged')) {
      window.location.href = 'admin-login.html';
      return;
    }
    await loadReferrals();
  });
</script>
</body>
</html>
