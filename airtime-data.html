<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Airtime & Data</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f4f3fa; --card:#ffffff;
    --primary:#5c3df4; --primary-dark:#4528d4; --primary-soft:#ede9ff;
    --accent:#a78bfa; --accent-gold:#f59e0b; --text:#1a1533; --muted:#7b7694;
    --border:#e3e0f5; --input-bg:#f8f7ff;
    --dark-card:linear-gradient(135deg,#1e1445 0%,#3b1fa8 100%);
    --shadow:0 8px 32px -8px rgba(92,61,244,0.18);
    --success:#16a34a; --error:#dc2626; --warn:#d97706;
    --mtn:#ffcc00; --airtel:#e60000; --glo:#00a84d; --nineMobile:#006400;
    --naira-green:#0d9488;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;
    background-image:radial-gradient(ellipse at 30% 20%,rgba(13,148,136,0.04) 0%,transparent 50%);
  }

  .topbar{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;}
  .back-btn{width:38px;height:38px;border-radius:50%;background:var(--input-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:var(--text);flex-shrink:0;transition:all 0.2s;}
  .back-btn:hover{background:var(--primary-soft);}
  .back-btn svg{width:18px;height:18px;}
  .topbar h1{font-size:1.05rem;font-weight:800;}
  .topbar p{font-size:0.75rem;color:var(--muted);}

  main{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto;}

  .naira-wallet{background:linear-gradient(135deg,#0d9488,#14b8a6);border-radius:14px;padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;}
  .naira-wallet .nw-left{display:flex;align-items:center;gap:8px;}
  .naira-wallet .nw-icon{font-size:1.3rem;}
  .naira-wallet .nw-label{font-size:0.65rem;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.5px;}
  .naira-wallet .nw-amount{font-size:1.2rem;font-weight:800;}
  .naira-wallet .nw-link{color:#fff;font-size:0.7rem;font-weight:700;text-decoration:none;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:50px;transition:all 0.2s;}
  .naira-wallet .nw-link:hover{background:rgba(255,255,255,0.25);}

  .tabs{display:flex;background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:4px;}
  .tab{flex:1;text-align:center;padding:10px 6px;font-size:0.85rem;font-weight:700;color:var(--muted);border-radius:11px;cursor:pointer;transition:.15s;}
  .tab.active{background:var(--naira-green);color:#fff;box-shadow:0 4px 12px rgba(13,148,136,0.3);}

  .section-title{font-size:0.9rem;font-weight:700;margin-bottom:8px;color:var(--text);}
  .network-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px;}
  .network-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer;transition:all 0.2s;}
  .network-card:hover{border-color:var(--primary);transform:translateY(-1px);}
  .network-card.selected{border-color:var(--primary);background:var(--primary-soft);}
  .network-card .net-logo{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;color:#fff;}
  .network-card .net-logo.mtn{background:var(--mtn);color:#1a1533;}
  .network-card .net-logo.airtel{background:var(--airtel);}
  .network-card .net-logo.glo{background:var(--glo);}
  .network-card .net-logo.nineMobile{background:var(--nineMobile);}
  .network-card .net-name{font-size:0.72rem;font-weight:700;color:var(--text);}

  .form-field{margin-bottom:14px;}
  .form-field label{display:block;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:6px;}
  .form-field input{width:100%;height:50px;background:var(--input-bg);border:2px solid var(--border);border-radius:14px;padding:0 14px;font-family:inherit;font-size:0.95rem;color:var(--text);outline:none;transition:all 0.2s;}
  .form-field input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(92,61,244,0.08);}
  .form-field .input-hint{font-size:0.68rem;color:var(--muted);margin-top:4px;}

  .amount-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
  .amount-chip{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px 6px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;}
  .amount-chip:hover{border-color:var(--primary);}
  .amount-chip.selected{border-color:var(--naira-green);background:#f0fdfa;}
  .amount-chip .amt-value{font-size:0.95rem;font-weight:800;color:var(--text);}
  .amount-chip .amt-sub{font-size:0.62rem;color:var(--muted);margin-top:2px;}
  .amount-chip.selected .amt-value{color:var(--naira-green);}
  .cashback-badge{position:absolute;top:-6px;right:-6px;background:var(--success);color:#fff;font-size:0.5rem;font-weight:700;padding:2px 5px;border-radius:50px;white-space:nowrap;}

  .custom-field{position:relative;margin-bottom:8px;}
  .custom-field span.prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--naira-green);font-weight:700;font-size:1rem;pointer-events:none;z-index:1;}
  .custom-field input{width:100%;height:50px;background:var(--input-bg);border:2px solid var(--border);border-radius:14px;padding:0 14px 0 32px;font-family:inherit;font-size:0.95rem;color:var(--text);outline:none;transition:all 0.2s;}
  .custom-field input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(92,61,244,0.08);}

  .btn-proceed{width:100%;height:54px;background:var(--naira-green);color:#fff;font-family:inherit;font-size:1rem;font-weight:700;border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;box-shadow:0 4px 16px rgba(13,148,136,0.3);}
  .btn-proceed:hover{background:#0f766e;transform:translateY(-1px);}
  .btn-proceed:disabled{opacity:0.5;cursor:not-allowed;transform:none;background:#9ca3af;box-shadow:none;}
  .btn-proceed svg{width:18px;height:18px;}

  .summary-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;display:none;}
  .summary-card.show{display:block;}
  .summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:0.82rem;}
  .summary-row .l{color:var(--muted);}
  .summary-row .v{font-weight:700;}
  .summary-row .v.green{color:var(--success);}
  .summary-divider{border-top:1px dashed var(--border);margin:6px 0;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,12,50,0.7);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:24px;padding:28px 22px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(92,61,244,0.3);animation:modalIn .3s ease;}
  @keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal-icon{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
  .modal-icon.success{background:#dcfce7;} .modal-icon.error{background:#fee2e2;} .modal-icon.info{background:var(--primary-soft);} .modal-icon.warn{background:#fef3c7;}
  .modal-icon svg{width:30px;height:30px;}
  .modal h3{font-size:1.15rem;font-weight:800;margin-bottom:8px;}
  .modal p{font-size:0.9rem;color:var(--muted);line-height:1.5;margin-bottom:20px;}
  .modal .form-field input{text-align:center;}
  .modal-btn{width:100%;padding:14px;border:none;border-radius:13px;font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;transition:all 0.2s;margin-top:6px;}
  .modal-btn:hover{background:var(--primary-dark);}
  .modal-btn.ghost{background:var(--input-bg);color:var(--muted);border:1.5px solid var(--border);}
  .spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;z-index:30;padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);padding:6px 0;}
  .nav-item svg{width:22px;height:22px;}
  .nav-item span{font-size:0.7rem;font-weight:600;}
  .nav-item.active{color:var(--primary);}
  .nav-item.active .nav-icon-wrap{background:var(--primary);border-radius:10px;width:38px;height:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(92,61,244,0.3);}
  .nav-item.active .nav-icon-wrap svg{color:#fff;width:18px;height:18px;}
  .nav-icon-wrap{display:flex;align-items:center;justify-content:center;height:30px;}
</style>
</head>
<body>

<div class="topbar">
  <a href="naira-hub.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div>
    <h1>Airtime & Data</h1>
    <p>Instant top-up for all networks</p>
  </div>
</div>

<main>

  <div class="naira-wallet">
    <div class="nw-left">
      <div class="nw-icon">💵</div>
      <div><div class="nw-label">Naira Wallet</div><div class="nw-amount">₦<span id="nairaWallet">0</span></div></div>
    </div>
    <a href="naira-deposit.html" class="nw-link">+ Fund</a>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabAirtime" onclick="switchTab('airtime')">📱 Airtime</div>
    <div class="tab" id="tabData" onclick="switchTab('data')">📶 Data</div>
  </div>

  <div id="contentArea"></div>

</main>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><span>Home</span></a>
  <a href="investment.html" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg></div><span>Orders</span></a>
  <a href="history.html" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><span>History</span></a>
  <a href="profile.html" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span>Account</span></a>
</nav>

<div class="modal-overlay" id="passwordModal">
  <div class="modal">
    <div class="modal-icon info"><svg viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
    <h3>Confirm Password</h3>
    <p>Enter your account password to proceed</p>
    <div class="form-field"><input type="password" id="confirmPassword" placeholder="Your password" autocomplete="current-password" /></div>
    <div style="display:flex;gap:8px;">
      <button class="modal-btn ghost" onclick="closePasswordModal()">Cancel</button>
      <button class="modal-btn" id="confirmBtn" onclick="submitRequest()"><span id="confirmBtnText">Confirm</span><div class="spinner" id="confirmSpinner"></div></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="resultModal">
  <div class="modal">
    <div class="modal-icon" id="resultIcon"></div><h3 id="resultTitle"></h3><p id="resultMsg"></p>
    <button class="modal-btn" onclick="closeResultModal()">OK</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, increment, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain: "nexa-a8cad.firebaseapp.com", projectId: "nexa-a8cad",
    storageBucket: "nexa-a8cad.firebasestorage.app", messagingSenderId: "324559998149", appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const NETWORKS = [
    { id:'mtn', name:'MTN', class:'mtn' },
    { id:'airtel', name:'Airtel', class:'airtel' },
    { id:'glo', name:'Glo', class:'glo' },
    { id:'9mobile', name:'9mobile', class:'nineMobile' }
  ];

  const AIRTIME_AMOUNTS = [100, 200, 300, 400, 500, 1000];
  const DATA_PLANS = [
    { amount:100, data:'100MB' },
    { amount:200, data:'200MB' },
    { amount:300, data:'300MB' },
    { amount:400, data:'400MB' },
    { amount:500, data:'500MB' }
  ];

  // ✅ Cashback: ₦50 for ALL data purchases ₦100 and above
  const CASHBACK_AMOUNT = 50;
  const CASHBACK_MIN = 100; // Minimum for cashback

  const fmtNGN = n => Math.round(n||0).toLocaleString();
  let currentUser = null, nairaWallet = 0, selectedNetwork = null, selectedAmount = 0, activeTab = 'airtime';

  window.switchTab = (t) => {
    activeTab = t;
    document.getElementById('tabAirtime').classList.toggle('active', t==='airtime');
    document.getElementById('tabData').classList.toggle('active', t==='data');
    selectedNetwork = null; selectedAmount = 0;
    renderContent();
  };

  window.selectNetwork = (id) => {
    selectedNetwork = id;
    document.querySelectorAll('.network-card').forEach(c => c.classList.toggle('selected', c.dataset.net === id));
    updateProceedButton(); updateSummary();
  };

  window.selectAmount = (amt) => {
    selectedAmount = amt;
    document.getElementById('customAmount').value = '';
    document.querySelectorAll('.amount-chip').forEach(c => c.classList.toggle('selected', Number(c.dataset.amt) === amt));
    updateProceedButton(); updateSummary();
  };

  function updateProceedButton() {
    const phone = document.getElementById('phoneNumber')?.value?.trim() || '';
    const btn = document.getElementById('btnProceed');
    if (btn) btn.disabled = !(selectedNetwork && selectedAmount >= 100 && phone.length === 11);
  }

  function updateSummary() {
    const card = document.getElementById('summaryCard');
    if (!card) return;
    if (selectedNetwork && selectedAmount >= 100) {
      const network = NETWORKS.find(n => n.id === selectedNetwork);
      // ✅ Cashback for data plans ₦100+
      const cashback = (activeTab === 'data' && selectedAmount >= CASHBACK_MIN) ? CASHBACK_AMOUNT : 0;
      card.classList.add('show');
      card.innerHTML = `
        <div class="summary-row"><span class="l">Service</span><span class="v">${activeTab==='airtime'?'📱 Airtime':'📶 Data'}</span></div>
        <div class="summary-row"><span class="l">Network</span><span class="v">${network?.name||'—'}</span></div>
        <div class="summary-row"><span class="l">Amount</span><span class="v">₦${fmtNGN(selectedAmount)}</span></div>
        ${activeTab==='data'?`<div class="summary-row"><span class="l">Data</span><span class="v">${DATA_PLANS.find(d=>d.amount===selectedAmount)?.data||selectedAmount+'MB'}</span></div>`:''}
        ${cashback>0?`<div class="summary-divider"></div><div class="summary-row"><span class="l">💰 Cashback (on approval)</span><span class="v green">+₦${fmtNGN(cashback)}</span></div>`:''}
        <div class="summary-divider"></div>
        <div class="summary-row"><span class="l">Wallet Balance</span><span class="v">₦${fmtNGN(nairaWallet)}</span></div>
      `;
    } else { card.classList.remove('show'); }
  }

  function renderContent() {
    const area = document.getElementById('contentArea');
    const isData = activeTab === 'data';
    const amounts = isData ? DATA_PLANS.map(d=>d.amount) : AIRTIME_AMOUNTS;

    area.innerHTML = `
      <p class="section-title">Select Network</p>
      <div class="network-grid">${NETWORKS.map(n=>`
        <div class="network-card" data-net="${n.id}" onclick="selectNetwork('${n.id}')">
          <div class="net-logo ${n.class}">${n.name.substring(0,2).toUpperCase()}</div>
          <div class="net-name">${n.name}</div>
        </div>`).join('')}
      </div>

      <div class="form-field">
        <label>Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="08012345678" maxlength="11" inputmode="numeric" oninput="this.value=this.value.replace(/\\D/g,'');updateProceedButton();updateSummary();" />
        <div class="input-hint">Enter 11-digit Nigerian number</div>
      </div>

      <p class="section-title">${isData ? 'Select Data Plan' : 'Select Amount'}</p>
      <div class="amount-grid">${amounts.map(amt=>`
        <div class="amount-chip" data-amt="${amt}" onclick="selectAmount(${amt})">
          <span class="amt-value">₦${fmtNGN(amt)}</span>
          ${isData?`<span class="amt-sub">${DATA_PLANS.find(d=>d.amount===amt)?.data||amt+'MB'}</span>`:`<span class="amt-sub">Airtime</span>`}
          ${isData&&amt>=CASHBACK_MIN?`<span class="cashback-badge">₦${CASHBACK_AMOUNT} back</span>`:''}
        </div>`).join('')}
      </div>

      <div class="custom-field">
        <span class="prefix">₦</span>
        <input type="number" id="customAmount" placeholder="Enter custom amount (min ₦100)" min="100" step="50" oninput="handleCustomAmount(this.value)" />
      </div>

      <div class="summary-card" id="summaryCard"></div>

      <button class="btn-proceed" id="btnProceed" onclick="openPasswordModal()" disabled>
        Proceed to Payment
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    `;
    selectedNetwork = null; selectedAmount = 0;
    updateProceedButton(); updateSummary();
  }

  window.handleCustomAmount = (val) => {
    const amt = parseInt(val) || 0;
    if (amt >= 100) { selectedAmount = amt; document.querySelectorAll('.amount-chip').forEach(c => c.classList.remove('selected')); }
    updateProceedButton(); updateSummary();
  };

  window.openPasswordModal = () => {
    if (!selectedNetwork || selectedAmount < 100) return;
    const phone = document.getElementById('phoneNumber')?.value?.trim() || '';
    if (phone.length !== 11) return;
    if (selectedAmount > nairaWallet) {
      showResult('error', 'Insufficient Balance', `You need ₦${fmtNGN(selectedAmount)} but your wallet has ₦${fmtNGN(nairaWallet)}. <a href="naira-deposit.html" style="color:var(--primary);">Fund wallet →</a>`);
      return;
    }
    document.getElementById('confirmPassword').value = '';
    document.getElementById('passwordModal').classList.add('show');
  };

  window.closePasswordModal = () => document.getElementById('passwordModal').classList.remove('show');

  window.submitRequest = async () => {
    const password = document.getElementById('confirmPassword').value;
    if (!password) return;
    const btn = document.getElementById('confirmBtn'), btnText = document.getElementById('confirmBtnText'), spinner = document.getElementById('confirmSpinner');
    btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';

    try {
      await signInWithEmailAndPassword(auth, currentUser.email, password);

      // ✅ Cashback for data ₦100+
      const cashback = (activeTab === 'data' && selectedAmount >= CASHBACK_MIN) ? CASHBACK_AMOUNT : 0;
      const network = NETWORKS.find(n => n.id === selectedNetwork);
      const phone = document.getElementById('phoneNumber').value.trim();

      await runTransaction(db, async (tx) => {
        const snap = await tx.get(doc(db, 'users', currentUser.uid));
        const bal = snap.data().nairaWallet || 0;
        if (bal < selectedAmount) throw new Error('INSUFFICIENT');
        tx.update(doc(db, 'users', currentUser.uid), { nairaWallet: bal - selectedAmount });
      });

      await addDoc(collection(db, 'nairaRequests'), {
        userId: currentUser.uid, userEmail: currentUser.email || '',
        type: activeTab === 'airtime' ? 'airtime' : 'data',
        network: network.name, networkId: selectedNetwork,
        phoneNumber: phone, amount: selectedAmount,
        dataPlan: activeTab === 'data' ? (DATA_PLANS.find(d => d.amount === selectedAmount)?.data || selectedAmount + 'MB') : null,
        cashback, status: 'pending', createdAt: serverTimestamp()
      });

      nairaWallet -= selectedAmount;
      document.getElementById('nairaWallet').textContent = fmtNGN(nairaWallet);
      closePasswordModal();

      const cashbackMsg = cashback > 0 ? ` 💰 You'll receive ₦${fmtNGN(cashback)} cashback when admin approves!` : '';
      showResult('success', 'Request Submitted! ✅', `Your ${activeTab==='airtime'?'airtime':'data'} request for ₦${fmtNGN(selectedAmount)} on ${network.name} (${phone}) has been sent.${cashbackMsg}`);
      selectedNetwork = null; selectedAmount = 0;
      renderContent();
    } catch (err) {
      closePasswordModal();
      if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') showResult('error', 'Wrong Password', 'Incorrect password.');
      else if (err.message === 'INSUFFICIENT') showResult('error', 'Insufficient Balance', 'Wallet balance changed.');
      else showResult('error', 'Failed', err.message);
    } finally { btn.disabled = false; btnText.style.display = 'inline'; spinner.style.display = 'none'; }
  };

  window.showResult = (type, title, msg) => {
    document.getElementById('resultIcon').className = 'modal-icon ' + type;
    document.getElementById('resultIcon').innerHTML = {
      success:`<svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
      error:`<svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      info:`<svg viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>`
    }[type];
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').innerHTML = msg;
    document.getElementById('resultModal').classList.add('show');
  };

  window.closeResultModal = () => document.getElementById('resultModal').classList.remove('show');

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) { nairaWallet = snap.data().nairaWallet || 0; document.getElementById('nairaWallet').textContent = fmtNGN(nairaWallet); }
    } catch(e) {}
    renderContent();
  });
</script>
</body>
</html>
