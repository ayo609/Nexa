<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0f0a1e;--card:#1a1333;--primary:#7c3aed;--primary-dark:#6d28d9;--text:#f5f3ff;--muted:#9d94b8;--border:#2d1f5e;--input-bg:#1e1644;--error:#ef4444;--success:#22c55e;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background-image:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,0.15) 0%,transparent 60%);
  }
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px 28px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(124,58,237,0.2);}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
  .logo-icon{width:48px;height:48px;border-radius:14px;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(124,58,237,0.4);}
  .logo-icon svg{width:24px;height:24px;color:#fff;}
  h1{font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:4px;}
  .subtitle{font-size:0.85rem;color:var(--muted);text-align:center;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input{width:100%;height:52px;background:var(--input-bg);border:2px solid var(--border);border-radius:14px;padding:0 16px;font-family:inherit;font-size:0.95rem;color:var(--text);outline:none;transition:all 0.2s;}
  .field input::placeholder{color:#6b5f8a;}
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,58,237,0.15);}
  .btn-login{width:100%;height:54px;background:var(--primary);color:#fff;font-family:inherit;font-size:1rem;font-weight:700;border:none;border-radius:14px;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(124,58,237,0.3);display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-login:hover{background:var(--primary-dark);transform:translateY(-1px);}
  .btn-login:disabled{opacity:0.5;cursor:not-allowed;}
  .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px 14px;font-size:0.85rem;color:var(--error);text-align:center;margin-bottom:16px;display:none;}
  .error-msg.show{display:block;}
  .success-msg{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:12px;padding:12px 14px;font-size:0.85rem;color:var(--success);text-align:center;margin-bottom:16px;display:none;}
  .success-msg.show{display:block;}
  .spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .back-link{text-align:center;margin-top:20px;font-size:0.85rem;color:var(--muted);}
  .back-link a{color:#a78bfa;text-decoration:none;font-weight:600;}
  .back-link a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
  </div>
  <h1>Admin Panel</h1>
  <p class="subtitle">Secure access for administrators</p>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <div class="field">
    <label>Admin Email</label>
    <input type="email" id="adminEmail" placeholder="admin@nexa.com" autocomplete="email" />
  </div>

  <div class="field">
    <label>Admin Password</label>
    <input type="password" id="adminPassword" placeholder="Enter admin password" autocomplete="current-password" />
  </div>

  <button class="btn-login" id="loginBtn" onclick="handleAdminLogin()">
    <span id="btnText">Sign In</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <p class="back-link"><a href="index.html">← Back to Nexa</a></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58",
    authDomain: "nexa-a8cad.firebaseapp.com",
    projectId: "nexa-a8cad",
    storageBucket: "nexa-a8cad.firebasestorage.app",
    messagingSenderId: "324559998149",
    appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ════════════ ADMIN EMAIL LIST ════════════
  const ADMIN_EMAILS = [
    'admin@nexa.com',
    'taufeek@nexa.com',
    'taufeekmuftau@gmail.com',
    'nexa@gmail.com'
  ];

  window.handleAdminLogin = async () => {
    const email = document.getElementById('adminEmail').value.trim().toLowerCase();
    const password = document.getElementById('adminPassword').value;
    const errorEl = document.getElementById('errorMsg');
    const successEl = document.getElementById('successMsg');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    errorEl.classList.remove('show');
    successEl.classList.remove('show');

    if (!email) { errorEl.textContent = 'Please enter your email address.'; errorEl.classList.add('show'); return; }
    if (!password) { errorEl.textContent = 'Please enter your password.'; errorEl.classList.add('show'); return; }

    // Quick check against admin list
    if (!ADMIN_EMAILS.includes(email)) {
      errorEl.textContent = 'Access denied. This email is not authorized.';
      errorEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btnText.style.display = 'none';
    spinner.style.display = 'block';

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid;

      // Verify in admins collection (if it exists)
      let isAdmin = ADMIN_EMAILS.includes(email);
      
      try {
        const adminDoc = await getDoc(doc(db, 'admins', uid));
        if (adminDoc.exists()) isAdmin = true;
      } catch (e) {}

      if (!isAdmin) {
        try {
          const adminsSnap = await getDocs(query(collection(db, 'admins'), where('email', '==', email)));
          if (!adminsSnap.empty) isAdmin = true;
        } catch (e) {}
      }

      if (!isAdmin) {
        await auth.signOut();
        errorEl.textContent = 'Access denied. Admin privileges not found.';
        errorEl.classList.add('show');
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
        return;
      }

      sessionStorage.setItem('nexa_admin_logged', '1');
      sessionStorage.setItem('nexa_admin_email', email);
      
      successEl.textContent = '✅ Login successful! Redirecting...';
      successEl.classList.add('show');
      
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 500);

    } catch (err) {
      const messages = {
        'auth/user-not-found': 'Account not found. Create it in Firebase Auth first.',
        'auth/wrong-password': 'Incorrect password. Try again.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/too-many-requests': 'Too many attempts. Wait a moment.',
        'auth/network-request-failed': 'Network error. Check connection.',
      };
      errorEl.textContent = messages[err.code] || 'Login failed. Try again.';
      errorEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
    }
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleAdminLogin();
  });

  onAuthStateChanged(auth, (user) => {
    if (user && sessionStorage.getItem('nexa_admin_logged')) {
      window.location.href = 'admin-dashboard.html';
    }
  });
</script>
</body>
</html>
