<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0f0a1e; --card:#1a1333;
    --primary:#7c3aed; --primary-dark:#6d28d9; --primary-soft:#2d1b69;
    --accent:#a78bfa; --text:#f5f3ff; --muted:#9d94b8; --border:#2d1f5e;
    --input-bg:#1e1644; --error:#ef4444; --success:#22c55e;
    --shadow:0 8px 40px rgba(124,58,237,0.2);
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background-image:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,0.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(167,139,250,0.08) 0%,transparent 50%);
  }
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px 28px;max-width:420px;width:100%;box-shadow:var(--shadow);}
  .login-card .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;text-decoration:none;}
  .logo-icon{width:48px;height:48px;border-radius:14px;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(124,58,237,0.4);}
  .logo-icon svg{width:24px;height:24px;color:#fff;}
  .login-card h1{font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:4px;}
  .login-card .subtitle{font-size:0.85rem;color:var(--muted);text-align:center;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input{width:100%;height:52px;background:var(--input-bg);border:2px solid var(--border);border-radius:14px;padding:0 16px;font-family:inherit;font-size:0.95rem;color:var(--text);outline:none;transition:all 0.2s;}
  .field input::placeholder{color:#6b5f8a;}
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,58,237,0.15);}
  .btn-login{width:100%;height:54px;background:var(--primary);color:#fff;font-family:inherit;font-size:1rem;font-weight:700;border:none;border-radius:14px;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(124,58,237,0.3);}
  .btn-login:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,58,237,0.4);}
  .btn-login:disabled{opacity:0.5;cursor:not-allowed;}
  .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px 14px;font-size:0.85rem;color:var(--error);text-align:center;margin-bottom:16px;display:none;}
  .error-msg.show{display:block;}
  .spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .back-link{text-align:center;margin-top:20px;font-size:0.85rem;color:var(--muted);}
  .back-link a{color:var(--accent);text-decoration:none;font-weight:600;}
  .back-link a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="login-card">
  <a class="logo" href="#">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
  </a>
  <h1>Admin Panel</h1>
  <p class="subtitle">Secure access for administrators</p>

  <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="adminEmail" placeholder="admin@nexa.com" autocomplete="email" />
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="adminPassword" placeholder="Enter admin password" autocomplete="current-password" />
  </div>

  <button class="btn-login" id="loginBtn" onclick="handleAdminLogin()">
    <span id="btnText">Sign In</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <p class="back-link"><a href="index.html">← Back to Nexa</a></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58",
    authDomain: "nexa-a8cad.firebaseapp.com",
    projectId: "nexa-a8cad",
    storageBucket: "nexa-a8cad.firebasestorage.app",
    messagingSenderId: "324559998149",
    appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ── ADMIN CREDENTIALS ──
  // Create an admin user in Firebase Auth with email: admin@nexa.com
  // Then add a document in Firestore: admins/{uid} with { role: "admin" }
  const ADMIN_EMAILS = ['admin@nexa.com', 'taufeek@nexa.com'];

  window.handleAdminLogin = async () => {
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    const errorEl = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');

    errorEl.classList.remove('show');
    if (!email || !password) { errorEl.textContent = 'Please fill in all fields.'; errorEl.classList.add('show'); return; }

    btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      
      // Check if user is admin
      const adminSnap = await getDoc(doc(db, 'admins', cred.user.uid));
      if (!adminSnap.exists() && !ADMIN_EMAILS.includes(email)) {
        await auth.signOut();
        errorEl.textContent = 'Access denied. You are not an administrator.';
        errorEl.classList.add('show');
        btn.disabled = false; btnText.style.display = 'inline'; spinner.style.display = 'none';
        return;
      }

      sessionStorage.setItem('nexa_admin_logged', '1');
      window.location.href = 'admin-dashboard.html';

    } catch (err) {
      const messages = {
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/too-many-requests': 'Too many attempts. Please wait.',
      };
      errorEl.textContent = messages[err.code] || 'Login failed. Please try again.';
      errorEl.classList.add('show');
    } finally {
      btn.disabled = false; btnText.style.display = 'inline'; spinner.style.display = 'none';
    }
  };

  // Enter key support
  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleAdminLogin(); });
</script>
</body>
</html>
