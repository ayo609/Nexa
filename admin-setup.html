<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Admin Setup</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0f0a1e;--card:#1a1333;--primary:#7c3aed;--primary-dark:#6d28d9;--text:#f5f3ff;--muted:#9d94b8;--border:#2d1f5e;--input-bg:#1e1644;--error:#ef4444;--success:#22c55e;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .setup-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:36px 28px;max-width:480px;width:100%;box-shadow:0 8px 40px rgba(124,58,237,0.2);}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;}
  .logo-icon{width:48px;height:48px;border-radius:14px;background:var(--primary);display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:24px;height:24px;color:#fff;}
  h1{font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:4px;}
  .subtitle{font-size:0.85rem;color:var(--muted);text-align:center;margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.75rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input{width:100%;height:48px;background:var(--input-bg);border:2px solid var(--border);border-radius:12px;padding:0 14px;font-family:inherit;font-size:0.9rem;color:var(--text);outline:none;transition:all 0.2s;}
  .field input:focus{border-color:var(--primary);}
  .btn{width:100%;height:52px;background:var(--primary);color:#fff;font-family:inherit;font-size:0.95rem;font-weight:700;border:none;border-radius:14px;cursor:pointer;transition:all 0.2s;margin-top:6px;}
  .btn:hover{background:var(--primary-dark);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn.green{background:var(--success);}
  .btn.green:hover{background:#15803d;}
  .msg{font-size:0.85rem;padding:12px 14px;border-radius:12px;margin-top:14px;display:none;text-align:center;line-height:1.5;}
  .msg.show{display:block;}
  .msg.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--success);}
  .msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--error);}
  .msg.info{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);color:#60a5fa;}
  .divider{text-align:center;margin:20px 0;color:var(--muted);font-size:0.78rem;position:relative;}
  .divider::before,.divider::after{content:'';position:absolute;top:50%;width:35%;height:1px;background:var(--border);}
  .divider::before{left:0;}.divider::after{right:0;}
  .admin-list{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;max-height:200px;overflow-y:auto;}
  .admin-list h4{font-size:0.8rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
  .admin-list .item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:0.82rem;border-bottom:1px solid var(--border);}
  .admin-list .item:last-child{border-bottom:none;}
  .admin-list .item span{color:var(--muted);font-size:0.7rem;}
  .badge{font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:50px;background:rgba(34,197,94,0.2);color:var(--success);}
  .back-link{text-align:center;margin-top:18px;font-size:0.82rem;}
  .back-link a{color:#a78bfa;text-decoration:none;font-weight:600;}
  .back-link a:hover{text-decoration:underline;}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="setup-card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
  </div>
  <h1>Admin Setup</h1>
  <p class="subtitle">Create or manage admin accounts</p>

  <div id="msgBox" class="msg"></div>

  <!-- CREATE NEW ADMIN -->
  <div class="field"><label>Admin Email</label><input type="email" id="newEmail" placeholder="admin@nexa.com" /></div>
  <div class="field"><label>Password (min 6 characters)</label><input type="password" id="newPassword" placeholder="Create password" /></div>
  <div class="field"><label>Admin Name</label><input type="text" id="newName" placeholder="Administrator" /></div>
  
  <button class="btn green" id="createBtn" onclick="createAdmin()">
    <span id="createBtnText">➕ Create Admin Account</span>
    <div class="spinner" id="createSpinner"></div>
  </button>

  <div class="divider">OR ADD EXISTING USER AS ADMIN</div>

  <div class="field"><label>Existing User Email</label><input type="email" id="existingEmail" placeholder="user@example.com" /></div>
  
  <button class="btn" id="promoteBtn" onclick="promoteToAdmin()">
    <span id="promoteBtnText">⬆️ Promote to Admin</span>
    <div class="spinner" id="promoteSpinner"></div>
  </button>

  <!-- EXISTING ADMINS LIST -->
  <div class="admin-list" id="adminList">
    <h4>Current Admins</h4>
    <div id="adminListContent" style="color:var(--muted);font-size:0.8rem;">Loading...</div>
  </div>

  <p class="back-link"><a href="admin-login.html">← Admin Login</a> | <a href="index.html">Home</a></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, fetchSignInMethodsForEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58",
    authDomain: "nexa-a8cad.firebaseapp.com",
    projectId: "nexa-a8cad",
    storageBucket: "nexa-a8cad.firebasestorage.app",
    messagingSenderId: "324559998149",
    appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function showMsg(type, text) {
    const box = document.getElementById('msgBox');
    box.className = 'msg ' + type + ' show';
    box.textContent = text;
    setTimeout(() => box.classList.remove('show'), 8000);
  }

  function setLoading(btnId, textId, spinnerId, loading) {
    document.getElementById(btnId).disabled = loading;
    document.getElementById(textId).style.display = loading ? 'none' : 'inline';
    document.getElementById(spinnerId).style.display = loading ? 'block' : 'none';
  }

  // ── CREATE NEW ADMIN ──
  window.createAdmin = async () => {
    const email = document.getElementById('newEmail').value.trim().toLowerCase();
    const password = document.getElementById('newPassword').value;
    const name = document.getElementById('newName').value.trim() || 'Administrator';

    if (!email) return showMsg('error', 'Please enter an email address.');
    if (!password || password.length < 6) return showMsg('error', 'Password must be at least 6 characters.');

    setLoading('createBtn', 'createBtnText', 'createSpinner', true);

    try {
      // Create user in Firebase Auth
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid;

      // Add to admins collection
      await setDoc(doc(db, 'admins', uid), {
        email: email,
        name: name,
        role: 'admin',
        permissions: ['all'],
        createdAt: serverTimestamp(),
        createdBy: 'setup_page'
      });

      showMsg('success', `✅ Admin account created!\n\nEmail: ${email}\nYou can now login at admin-login.html`);
      
      // Clear form
      document.getElementById('newEmail').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('newName').value = '';

      // Also add to users collection if not exists
      const userDoc = await getDoc(doc(db, 'users', uid));
      if (!userDoc.exists()) {
        await setDoc(doc(db, 'users', uid), {
          uid, email, phone: '', referralCode: uid.substring(0,8).toUpperCase(),
          walletBalance: 0, totalEarnings: 0, status: 'active',
          currency: 'USDT', createdAt: serverTimestamp()
        });
      }

      loadAdminList();

    } catch (err) {
      console.error('Create admin error:', err);
      if (err.code === 'auth/email-already-in-use') {
        showMsg('info', 'This email already has an account. Use the "Promote to Admin" section below to make them an admin.');
      } else {
        showMsg('error', 'Error: ' + (err.message || 'Failed to create admin.'));
      }
    } finally {
      setLoading('createBtn', 'createBtnText', 'createSpinner', false);
    }
  };

  // ── PROMOTE EXISTING USER TO ADMIN ──
  window.promoteToAdmin = async () => {
    const email = document.getElementById('existingEmail').value.trim().toLowerCase();
    if (!email) return showMsg('error', 'Please enter the user\'s email address.');

    setLoading('promoteBtn', 'promoteBtnText', 'promoteSpinner', true);

    try {
      // Find user by email in users collection
      const usersSnap = await getDocs(collection(db, 'users'));
      let foundUid = null;

      usersSnap.forEach(d => {
        const u = d.data();
        if (u.email && u.email.toLowerCase() === email) {
          foundUid = d.id;
        }
      });

      if (!foundUid) {
        // Check admins collection too
        const adminsSnap = await getDocs(collection(db, 'admins'));
        adminsSnap.forEach(d => {
          const a = d.data();
          if (a.email && a.email.toLowerCase() === email) {
            foundUid = d.id;
          }
        });
      }

      if (!foundUid) {
        showMsg('error', 'User not found. Make sure they have registered on the platform first.');
        setLoading('promoteBtn', 'promoteBtnText', 'promoteSpinner', false);
        return;
      }

      // Add to admins collection
      await setDoc(doc(db, 'admins', foundUid), {
        email: email,
        name: email.split('@')[0],
        role: 'admin',
        permissions: ['all'],
        createdAt: serverTimestamp(),
        createdBy: 'setup_page'
      });

      showMsg('success', `✅ User promoted to admin!\n\nEmail: ${email}\nThey can now login at admin-login.html`);
      document.getElementById('existingEmail').value = '';
      loadAdminList();

    } catch (err) {
      console.error('Promote error:', err);
      showMsg('error', 'Error: ' + (err.message || 'Failed to promote user.'));
    } finally {
      setLoading('promoteBtn', 'promoteBtnText', 'promoteSpinner', false);
    }
  };

  // ── LOAD ADMIN LIST ──
  async function loadAdminList() {
    try {
      const snap = await getDocs(collection(db, 'admins'));
      let html = '';
      
      if (snap.empty) {
        html = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:10px;">No admins found yet</div>';
      } else {
        snap.forEach(d => {
          const a = d.data();
          html += `<div class="item">
            <div><strong>${a.email||'—'}</strong><br><span>${a.name||'Admin'} · ${a.role||'admin'}</span></div>
            <span class="badge">Admin</span>
          </div>`;
        });
      }
      
      document.getElementById('adminListContent').innerHTML = html;
    } catch (err) {
      document.getElementById('adminListContent').innerHTML = '<div style="color:var(--muted);">Could not load admin list.</div>';
    }
  }

  // Load on page open
  loadAdminList();
</script>
</body>
</html>
