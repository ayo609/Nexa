<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Nexa – Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f3fa;
      --card: #ffffff;
      --primary: #5c3df4;
      --primary-dark: #4528d4;
      --primary-soft: #ede9ff;
      --accent: #a78bfa;
      --accent-gold: #f59e0b;
      --text: #1a1533;
      --muted: #7b7694;
      --border: #e3e0f5;
      --input-bg: #f8f7ff;
      --shadow: 0 8px 32px -8px rgba(92, 61, 244, 0.18);
      --error: #dc2626;
      --success: #16a34a;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background-image: 
        radial-gradient(ellipse at 80% 20%, rgba(92,61,244,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 80%, rgba(167,139,250,0.05) 0%, transparent 50%);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(92,61,244,0.3);
    }
    .logo-icon svg { width: 21px; height: 21px; }
    .logo-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .logo-name span { color: var(--primary); }

    .btn-register {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1.5px solid transparent;
      border-radius: 50px;
      padding: 9px 24px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-register:hover { background: #ddd6fe; transform: translateY(-1px); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .card .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .field {
      position: relative;
      margin-bottom: 16px;
    }
    .field input {
      width: 100%;
      height: 52px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 0 48px 0 46px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }
    .field input::placeholder { color: #b3aed4; font-size: 0.9rem; }
    .field input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(92, 61, 244, 0.08);
    }
    .field input.error { border-color: var(--error); background: #fef2f2; }

    .field-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #b3aed4;
      display: flex;
      pointer-events: none;
    }
    .field-icon svg { width: 20px; height: 20px; }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #b3aed4;
      display: flex;
      padding: 8px;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--primary); }
    .toggle-pw svg { width: 20px; height: 20px; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin: -6px 0 20px;
    }
    .forgot-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--primary-dark); text-decoration: underline; }

    .btn-login {
      width: 100%;
      height: 54px;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 16px rgba(92,61,244,0.3);
    }
    .btn-login:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(92,61,244,0.4); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 600ms linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .register-link {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 22px;
    }
    .register-link a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
    }
    .register-link a:hover { color: var(--primary-dark); text-decoration: underline; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20,12,50,0.6);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--card);
      border-radius: 24px;
      padding: 30px 24px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(92,61,244,0.3);
      animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-icon.success { background: #dcfce7; }
    .modal-icon.error   { background: #fee2e2; }
    .modal-icon.info    { background: var(--primary-soft); }
    .modal-icon svg     { width: 30px; height: 30px; }

    .modal h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .modal p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 13px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .modal-btn.primary { background: var(--primary); color: #fff; }
    .modal-btn.primary:hover { background: var(--primary-dark); }
    .modal-btn.ghost {
      background: var(--input-bg);
      color: var(--muted);
      border: 1.5px solid var(--border);
    }
    .modal-btn.ghost:hover { background: var(--border); }

    .forgot-field {
      text-align: left;
      margin-bottom: 16px;
    }
    .forgot-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .forgot-field input {
      width: 100%;
      height: 50px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 13px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .forgot-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(92,61,244,0.08); }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="#">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <span class="logo-name">Nex<span>a</span></span>
  </a>
  <a href="index.html" class="btn-register">Create account</a>
</nav>

<main>
  <div class="card">
    <h1>Sign in</h1>
    <p class="subtitle">Access your USDT wallet &amp; earnings</p>

    <div class="field">
      <span class="field-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </span>
      <input type="email" id="email" placeholder="Email address" autocomplete="email" />
    </div>

    <div class="field">
      <span class="field-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </span>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <button class="toggle-pw" onclick="togglePw()" type="button" tabindex="-1" id="eyeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="forgot-row">
      <span class="forgot-link" onclick="openForgot()">Forgot password?</span>
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Sign in</span>
    </button>

    <p class="register-link">Don't have an account? <a href="index.html">Create one free</a></p>
  </div>
</main>

<!-- ALERT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon" id="modalIcon"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <button class="modal-btn primary" onclick="closeModal()">OK</button>
  </div>
</div>

<!-- FORGOT MODAL -->
<div class="modal-overlay" id="forgotModal">
  <div class="modal">
    <div class="modal-icon info">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>
    <h3>Reset Password</h3>
    <p>Enter your email and we'll send you a reset link.</p>
    <div class="forgot-field">
      <label>Email</label>
      <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="modal-actions">
      <button class="modal-btn ghost" onclick="closeForgot()">Cancel</button>
      <button class="modal-btn primary" id="resetBtn" onclick="handleReset()">Send link</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58",
    authDomain: "nexa-a8cad.firebaseapp.com",
    projectId: "nexa-a8cad",
    storageBucket: "nexa-a8cad.firebasestorage.app",
    messagingSenderId: "324559998149",
    appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const ICONS = {
    success: `<svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
    error:   `<svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
    info:    `<svg viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
  };

  function showModal(type, title, msg, cb) {
    document.getElementById('modalIcon').className = 'modal-icon ' + type;
    document.getElementById('modalIcon').innerHTML = ICONS[type];
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modalOverlay').classList.add('show');
    window._modalCb = cb || null;
  }

  window.closeModal = function() {
    document.getElementById('modalOverlay').classList.remove('show');
    if (window._modalCb) { window._modalCb(); window._modalCb = null; }
  };

  function setLoading(on) {
    const btn = document.getElementById('loginBtn');
    const spin = document.getElementById('spinner');
    const text = document.getElementById('btnText');
    btn.disabled = on;
    spin.style.display = on ? 'block' : 'none';
    text.textContent = on ? 'Signing in…' : 'Sign in';
  }

  function friendlyError(code) {
    const map = {
      'auth/user-not-found': 'No account found. Please register first.',
      'auth/wrong-password': 'Incorrect password. Try again.',
      'auth/invalid-credential': 'Invalid email or password.',
      'auth/invalid-email': 'Enter a valid email address.',
      'auth/too-many-requests': 'Too many attempts. Wait a moment.',
      'auth/network-request-failed': 'Network error. Check your connection.',
    };
    return map[code] || 'Something went wrong. Try again.';
  }

  window.handleLogin = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email) return showModal('info', 'Email required', 'Enter your email address.');
    if (!password) return showModal('info', 'Password required', 'Enter your password.');

    setLoading(true);
    try {
      await signInWithEmailAndPassword(auth, email, password);
      setLoading(false);
      showModal('success', 'Welcome back!', 'Signed in successfully. Redirecting to dashboard...', () => {
        window.location.href = 'dashboard.html';
      });
    } catch (err) {
      setLoading(false);
      showModal('error', 'Sign in failed', friendlyError(err.code));
    }
  };

  window.openForgot = () => {
    document.getElementById('resetEmail').value = document.getElementById('email').value;
    document.getElementById('forgotModal').classList.add('show');
  };
  window.closeForgot = () => document.getElementById('forgotModal').classList.remove('show');

  window.handleReset = async function() {
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) return;
    const btn = document.getElementById('resetBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      await sendPasswordResetEmail(auth, email);
      closeForgot();
      showModal('success', 'Link sent!', 'Check your inbox for the password reset link.');
    } catch (err) {
      closeForgot();
      showModal('error', 'Failed', err.code === 'auth/user-not-found' ? 'No account with that email.' : 'Try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send link';
    }
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('forgotModal').classList.contains('show')) handleReset();
      else if (!document.getElementById('modalOverlay').classList.contains('show')) handleLogin();
      else closeModal();
    }
    if (e.key === 'Escape') { closeModal(); closeForgot(); }
  });
</script>

<script>
  function togglePw() {
    const input = document.getElementById('password');
    const btn = document.getElementById('eyeBtn');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  }
</script>
</body>
</html>
