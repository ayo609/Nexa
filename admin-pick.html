<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Admin: ROI Audit & Recovery</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0f0f1a; --card:#1a1a2e; --card2:#16213e;
    --primary:#5c3df4; --accent:#a78bfa; --text:#e2e8f0; --muted:#94a3b8;
    --border:#2d2d44; --input-bg:#1e1e38;
    --success:#16a34a; --error:#dc2626; --warn:#d97706;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;}

  .header{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid var(--border);text-align:center;}
  .header h1{font-size:1.1rem;font-weight:800;color:var(--error);}
  .header p{font-size:0.78rem;color:var(--muted);margin-top:4px;}

  .btn{width:100%;height:50px;background:var(--primary);color:#fff;font-family:inherit;font-size:0.9rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;margin-bottom:10px;}
  .btn.warn{background:var(--warn);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .stat-box{background:var(--card);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--border);}
  .stat-box .sv{font-size:1.1rem;font-weight:800;color:var(--accent);}
  .stat-box .sl{font-size:0.6rem;color:var(--muted);text-transform:uppercase;margin-top:2px;}

  .user-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border);}
  .user-card .top{display:flex;justify-content:space-between;font-weight:800;font-size:0.85rem;margin-bottom:4px;}
  .user-card .name{font-size:0.9rem;font-weight:800;color:var(--accent);margin-bottom:2px;}
  .user-card .email{font-size:0.7rem;color:var(--muted);margin-bottom:6px;}
  .user-card .detail{font-size:0.72rem;color:var(--muted);margin-bottom:2px;}
  .user-card .detail span{color:var(--text);font-weight:600;}
  .user-card .excess{color:var(--error);font-weight:800;font-size:0.85rem;margin:6px 0;}
  .user-card .withdrawn{color:var(--warn);font-weight:700;font-size:0.75rem;}
  .user-card button{width:100%;height:36px;border:none;border-radius:8px;font-family:inherit;font-size:0.75rem;font-weight:700;cursor:pointer;color:#fff;margin-top:8px;}
  .user-card button.recover{background:var(--error);}

  .results-box{max-height:500px;overflow-y:auto;}
  .log-box{background:#000;border-radius:10px;padding:12px;font-family:monospace;font-size:0.7rem;color:#6ee7b7;max-height:200px;overflow-y:auto;margin-top:10px;display:none;}
  .log-box.show{display:block;}
  .log-box .err{color:#fca5a5;}
  .log-box .warn{color:#fbbf24;}
  .log-box .ok{color:#6ee7b7;}

  .loading{text-align:center;padding:16px;display:none;}
  .loading.show{display:block;}
  .spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{font-size:0.8rem;color:var(--muted);}
</style>
</head>
<body>

<div class="header">
  <h1>🔍 ROI Audit & Recovery Tool</h1>
  <p>Track over-credited users · Calculate excess · Recover from wallets</p>
</div>

<button class="btn" onclick="runAudit()">🔍 Run Full Audit (Scan All Users)</button>
<button class="btn warn" id="btnRecoverAll" onclick="recoverAll()" disabled>💸 Recover From All Affected Users</button>

<div class="stats-grid">
  <div class="stat-box"><div class="sv" id="statUsers">0</div><div class="sl">Affected Users</div></div>
  <div class="stat-box"><div class="sv" id="statExcess">$0.00</div><div class="sl">Total Excess</div></div>
  <div class="stat-box"><div class="sv" id="statWithdrawn">$0.00</div><div class="sl">Already Withdrawn</div></div>
</div>

<div class="loading" id="loadingBox"><div class="spinner"></div><p id="loadingText">Auditing...</p></div>

<div class="log-box" id="logBox"></div>

<div class="results-box" id="resultsBox"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const fc = { apiKey:"AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain:"nexa-a8cad.firebaseapp.com", projectId:"nexa-a8cad", storageBucket:"nexa-a8cad.firebasestorage.app", messagingSenderId:"324559998149", appId:"1:324559998149:web:e23ddfa3f0c71114eab4ac" };
  const app = initializeApp(fc);
  const db = getFirestore(app);

  const fu = n => (Number(n)||0).toFixed(2);
  const ff = n => Math.round(Number(n)||0).toLocaleString();

  let affectedUsers = [];
  let totalExcessAll = 0;
  let totalWithdrawnAll = 0;

  function log(msg, type) {
    const box = document.getElementById('logBox');
    box.classList.add('show');
    const time = new Date().toLocaleTimeString();
    box.innerHTML += `<div class="${type||''}">[${time}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  function setLoading(show, text) {
    document.getElementById('loadingBox').classList.toggle('show', show);
    document.getElementById('loadingText').textContent = text || 'Processing...';
  }

  function getTs(ts) {
    if(!ts) return 0;
    if(ts.toMillis) return ts.toMillis();
    if(ts.seconds) return ts.seconds*1000;
    if(ts instanceof Date) return ts.getTime();
    return typeof ts==='number'?ts:0;
  }

  function countWeekdaysFrom(fromMs, maxDays) {
    const now = Date.now();
    const d = new Date(fromMs); d.setHours(0,0,0,0);
    let count = 0, ch = new Date(d);
    ch.setDate(ch.getDate() + 1); ch.setHours(0,0,0,0);
    while (ch.getTime() <= now && count < maxDays) {
      if (ch.getDay() >= 1 && ch.getDay() <= 5) count++;
      ch.setDate(ch.getDate() + 1);
    }
    return count;
  }

  // ════════ GET USER NAME ════════
  async function getUserName(uid) {
    try {
      const userSnap = await getDoc(doc(db, 'users', uid));
      if (userSnap.exists()) {
        const data = userSnap.data();
        // Try different name fields
        return data.fullName || data.name || data.displayName || (data.email ? data.email.split('@')[0] : 'Unknown');
      }
      return 'Unknown';
    } catch (e) {
      return 'Unknown';
    }
  }

  // ════════ RUN AUDIT ════════
  window.runAudit = async () => {
    affectedUsers = [];
    totalExcessAll = 0;
    totalWithdrawnAll = 0;
    
    setLoading(true, 'Fetching all investments...');
    log('🚀 Starting full ROI audit...', 'warn');
    document.getElementById('resultsBox').innerHTML = '';

    try {
      const invSnap = await getDocs(collection(db, 'investments'));
      const userMap = new Map();

      let processed = 0;
      const totalInvestments = invSnap.size;

      for (const invDoc of invSnap.docs) {
        const inv = invDoc.data();
        const uid = inv.userId;
        const planName = inv.planName || 'Plan';
        const daily = inv.daily || 0;
        const daysPaid = inv.daysPaid || 0;
        const maxDays = inv.days || 20;
        const totalPaidOut = inv.totalPaidOut || 0;
        
        if (daysPaid >= maxDays) continue;

        let startFrom;
        if (inv.unlockedAt) {
          startFrom = getTs(inv.unlockedAt);
        } else {
          startFrom = getTs(inv.createdAt);
        }
        
        if (startFrom === 0) continue;

        const correctWeekdays = countWeekdaysFrom(startFrom, maxDays);
        const correctDaysPaid = Math.min(daysPaid, correctWeekdays);
        const correctROI = correctDaysPaid * daily;
        const excess = totalPaidOut - correctROI;
        
        if (excess > 0.001) {
          if (!userMap.has(uid)) {
            const name = await getUserName(uid);
            userMap.set(uid, { 
              uid,
              name: name,
              email: inv.userEmail || 'unknown', 
              totalExcess: 0, 
              plans: [],
              withdrawalAmount: 0,
              currentBalance: 0
            });
          }
          
          const userData = userMap.get(uid);
          userData.totalExcess += excess;
          userData.plans.push({
            planName,
            daysPaid,
            correctDaysPaid,
            daily,
            excess
          });
        }

        processed++;
        if (processed % 10 === 0) {
          document.getElementById('loadingText').textContent = `Auditing ${processed}/${totalInvestments}...`;
        }
      }

      // Get current balance and withdrawals for each user
      for (const [uid, userData] of userMap.entries()) {
        const userSnap = await getDoc(doc(db, 'users', uid));
        if (userSnap.exists()) {
          const data = userSnap.data();
          userData.currentBalance = Number(data.withdrawalWallet) || 0;
        }
        
        const wSnap = await getDocs(query(collection(db, 'withdrawals'), where('userId', '==', uid)));
        let totalWithdrawn = 0;
        wSnap.forEach(wDoc => {
          const w = wDoc.data();
          if (w.status !== 'rejected') {
            totalWithdrawn += (w.amount || 0);
          }
        });
        userData.withdrawalAmount = totalWithdrawn;
        totalWithdrawnAll += totalWithdrawn;
      }

      affectedUsers = Array.from(userMap.values());
      totalExcessAll = affectedUsers.reduce((s, u) => s + u.totalExcess, 0);

      document.getElementById('statUsers').textContent = affectedUsers.length;
      document.getElementById('statExcess').textContent = '$' + fu(totalExcessAll);
      document.getElementById('statWithdrawn').textContent = '$' + fu(totalWithdrawnAll);

      displayResults();
      document.getElementById('btnRecoverAll').disabled = affectedUsers.length === 0;

      log(`✅ Audit complete: ${affectedUsers.length} users affected, $${fu(totalExcessAll)} excess`, 'warn');

    } catch (e) {
      log(`❌ Error: ${e.message}`, 'err');
    }
    setLoading(false);
  };

  function displayResults() {
    const box = document.getElementById('resultsBox');
    
    if (affectedUsers.length === 0) {
      box.innerHTML = '<p style="text-align:center;color:var(--success);padding:20px;">✅ No affected users found.</p>';
      return;
    }

    affectedUsers.sort((a, b) => b.totalExcess - a.totalExcess);

    let html = '<h3 style="font-size:0.85rem;color:var(--accent);margin-bottom:8px;">Affected Users</h3>';
    
    affectedUsers.forEach(user => {
      const balanceDisplay = user.currentBalance < 0 
        ? '-$' + fu(Math.abs(user.currentBalance)) 
        : '$' + fu(user.currentBalance);
      
      html += `<div class="user-card">
        <div class="name">👤 ${user.name}</div>
        <div class="email">📧 ${user.email}</div>
        <div class="top">
          <span>Excess: <span style="color:var(--error);">$${fu(user.totalExcess)}</span></span>
        </div>`;
      
      user.plans.forEach(p => {
        html += `<div class="detail">• ${p.planName}: Day ${p.daysPaid} → correct: ${p.correctDaysPaid} | Excess: <span style="color:var(--error);">$${fu(p.excess)}</span></div>`;
      });
      
      html += `<div class="excess">💰 Total Excess: $${fu(user.totalExcess)}</div>`;
      html += `<div class="withdrawn">📤 Already Withdrawn: $${fu(user.withdrawalAmount)}</div>`;
      html += `<div class="detail">Current Balance: <span style="color:${user.currentBalance < 0 ? 'var(--error)' : 'var(--success)'};">${balanceDisplay}</span></div>`;
      html += `<button class="recover" onclick="recoverSingle('${user.uid}', ${user.totalExcess}, '${user.name.replace(/'/g, "\\'")}')">💸 Recover $${fu(user.totalExcess)}</button>`;
      html += '</div>';
    });
    
    box.innerHTML = html;
  }

  // ════════ RECOVER SINGLE USER ════════
  window.recoverSingle = async (uid, excessAmount, userName) => {
    if (!confirm(`Deduct $${fu(excessAmount)} from ${userName}'s Withdrawal Wallet?`)) return;
    
    setLoading(true, 'Recovering...');
    
    try {
      const userSnap = await getDoc(doc(db, 'users', uid));
      if (userSnap.exists()) {
        const data = userSnap.data();
        const currentWdW = Number(data.withdrawalWallet) || 0;
        const currentDpW = Number(data.depositWallet) || 0;
        
        const newWdW = currentWdW - excessAmount;
        
        await updateDoc(doc(db, 'users', uid), {
          withdrawalWallet: newWdW,
          walletBalance: currentDpW + newWdW
        });
        
        log(`✅ Recovered $${fu(excessAmount)} from ${userName}. New balance: $${fu(newWdW)}`, 'ok');
        await runAudit();
      }
    } catch (e) {
      log(`❌ Error: ${e.message}`, 'err');
    }
    setLoading(false);
  };

  // ════════ RECOVER ALL ════════
  window.recoverAll = async () => {
    if (affectedUsers.length === 0) { alert('No users to recover from.'); return; }
    if (!confirm(`Recover $${fu(totalExcessAll)} total from ${affectedUsers.length} users?\n\nThis will deduct from their Withdrawal Wallet (can go negative).`)) return;
    
    document.getElementById('btnRecoverAll').disabled = true;
    setLoading(true, 'Recovering all excess amounts...');
    
    let recovered = 0;
    let errors = 0;
    
    for (const user of affectedUsers) {
      try {
        const userSnap = await getDoc(doc(db, 'users', user.uid));
        if (userSnap.exists()) {
          const data = userSnap.data();
          const currentWdW = Number(data.withdrawalWallet) || 0;
          const currentDpW = Number(data.depositWallet) || 0;
          
          const newWdW = currentWdW - user.totalExcess;
          
          await updateDoc(doc(db, 'users', user.uid), {
            withdrawalWallet: newWdW,
            walletBalance: currentDpW + newWdW
          });
          
          recovered += user.totalExcess;
          log(`✅ ${user.name} (${user.email}): Deducted $${fu(user.totalExcess)}. New: $${fu(newWdW)}`, 'ok');
        }
      } catch (e) {
        errors++;
        log(`❌ ${user.email}: Error - ${e.message}`, 'err');
      }
    }
    
    log(`🎉 Recovery complete: $${fu(recovered)} recovered. ${errors} errors.`, 'warn');
    setLoading(false);
    alert(`Recovered $${fu(recovered)} from ${affectedUsers.length} users.`);
  };
</script>
</body>
</html>
