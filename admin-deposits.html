<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa Admin – Deposits</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0f0a1e;--card:#1a1333;--sidebar:#120c24;--primary:#7c3aed;--primary-dark:#6d28d9;--primary-soft:#2d1b69;--accent:#a78bfa;--text:#f5f3ff;--muted:#9d94b8;--border:#2d1f5e;--input-bg:#1e1644;--error:#ef4444;--success:#22c55e;--warn:#f59e0b;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}

  .sidebar{width:250px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:20;overflow-y:auto;}
  .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:8px;text-decoration:none;}
  .logo-icon{width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:20px;height:20px;color:#fff;}
  .sidebar .logo span{font-size:1.1rem;font-weight:800;color:var(--text);}
  .sidebar .logo em{color:var(--accent);font-style:normal;}
  .nav-section{font-size:0.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:16px 12px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-size:0.84rem;font-weight:600;margin-bottom:2px;transition:all 0.2s;}
  .nav-item:hover{background:var(--primary-soft);color:var(--text);}
  .nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,0.3);}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;}
  .main-content{flex:1;margin-left:250px;padding:24px 28px;min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  .topbar h1{font-size:1.5rem;font-weight:800;}

  .filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-tab{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:inherit;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .filter-tab:hover{border-color:var(--primary);color:var(--text);}
  .filter-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .section-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;}
  .section-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .section-header h3{font-size:1rem;font-weight:700;}
  .count-badge{font-size:0.72rem;font-weight:700;padding:4px 12px;border-radius:50px;background:rgba(245,158,11,0.2);color:var(--warn);}

  table{width:100%;border-collapse:collapse;}
  table th{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:12px 14px;text-align:left;background:var(--input-bg);white-space:nowrap;}
  table td{font-size:0.84rem;padding:14px;border-bottom:1px solid var(--border);}
  table tr:hover{background:rgba(124,58,237,0.04);}

  .status-pill{font-size:0.66rem;font-weight:700;padding:4px 10px;border-radius:50px;display:inline-block;}
  .status-pill.pending{background:rgba(245,158,11,0.2);color:var(--warn);}
  .status-pill.approved{background:rgba(34,197,94,0.2);color:var(--success);}
  .status-pill.rejected{background:rgba(239,68,68,0.2);color:var(--error);}

  .btn{font-size:0.7rem;font-weight:700;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s;margin:2px;}
  .btn.approve{background:rgba(34,197,94,0.2);color:var(--success);}
  .btn.approve:hover{background:rgba(34,197,94,0.4);}
  .btn.reject{background:rgba(239,68,68,0.2);color:var(--error);}
  .btn.reject:hover{background:rgba(239,68,68,0.4);}
  .btn.view{background:rgba(59,130,246,0.2);color:#60a5fa;}
  .btn.view:hover{background:rgba(59,130,246,0.4);}

  .loading{text-align:center;padding:60px;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{text-align:center;padding:50px;color:var(--muted);}

  /* RECEIPT MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:650px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:1.1rem;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
  .modal h3 svg{width:20px;height:20px;color:var(--accent);}
  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
  .info-item{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .info-item .l{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .info-item .v{font-size:0.88rem;font-weight:700;color:var(--text);word-break:break-all;}
  .info-item.full{grid-column:1/-1;}

  .receipt-container{background:#000;border-radius:14px;overflow:hidden;margin-bottom:16px;position:relative;cursor:zoom-in;display:flex;align-items:center;justify-content:center;min-height:200px;max-height:400px;}
  .receipt-container img{width:100%;height:auto;max-height:400px;object-fit:contain;display:block;transition:transform 0.3s;}
  .receipt-container.zoomed{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.95);cursor:zoom-out;max-height:100vh;border-radius:0;padding:20px;}
  .receipt-container.zoomed img{max-height:95vh;object-fit:contain;transform:scale(1);}
  .receipt-actions{display:flex;gap:8px;margin-top:8px;}
  .receipt-actions .btn{flex:1;text-align:center;}
  .no-receipt{text-align:center;padding:40px;color:var(--muted);background:var(--input-bg);border-radius:14px;}
  .no-receipt svg{width:48px;height:48px;color:var(--border);margin-bottom:8px;}

  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-btn{flex:1;padding:13px;border:none;border-radius:12px;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .modal-btn.primary{background:var(--primary);color:#fff;}
  .modal-btn.ghost{background:var(--input-bg);color:var(--muted);border:1px solid var(--border);}
  .modal-btn.success{background:var(--success);color:#fff;}
  .modal-btn.danger{background:var(--error);color:#fff;}

  @media(max-width:900px){.sidebar{width:65px;padding:12px 6px;}.sidebar .logo span,.nav-item span,.nav-section{display:none;}.nav-item{justify-content:center;padding:12px 8px;}.main-content{margin-left:65px;padding:16px;}.info-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<aside class="sidebar">
  <a class="logo" href="admin-dashboard.html"><div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span>Nex<em>a</em> Admin</span></a>
  <div class="nav-section">Main</div>
  <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Dashboard</a>
  <div class="nav-section">Management</div>
  <a href="admin-deposits.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M12 18V6"/></svg>Deposits</a>
  <a href="admin-withdrawals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 010-4h12v4"/></svg>Withdrawals</a>
  <a href="admin-investments.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>Investments</a>
  <a href="admin-referrals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>Referrals</a>
  <div class="nav-section">Users</div>
  <a href="admin-users.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>All Users</a>
  <div class="nav-section">System</div>
  <a href="admin-settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  <a href="#" class="nav-item" style="color:var(--error);margin-top:auto;" onclick="adminLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/></svg>Logout</a>
</aside>

<div class="main-content">
  <div class="topbar"><h1>Deposit Management</h1></div>

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterDeposits('all', this)">All Deposits</button>
    <button class="filter-tab" onclick="filterDeposits('pending', this)">⏳ Pending</button>
    <button class="filter-tab" onclick="filterDeposits('approved', this)">✅ Approved</button>
    <button class="filter-tab" onclick="filterDeposits('rejected', this)">❌ Rejected</button>
  </div>

  <div class="section-card">
    <div class="section-header"><h3>Deposit Requests</h3><span class="count-badge" id="depCount">0 total</span></div>
    <div id="depositsTable"><div class="loading"><div class="spinner"></div><p>Loading deposits...</p></div></div>
  </div>
</div>

<!-- DETAIL/RECEIPT MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" id="detailModalContent"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA4nRl80lwklik6A8RTvE0Py-jNEg8PJ58", authDomain: "nexa-a8cad.firebaseapp.com", projectId: "nexa-a8cad", storageBucket: "nexa-a8cad.firebasestorage.app", messagingSenderId: "324559998149", appId: "1:324559998149:web:e23ddfa3f0c71114eab4ac" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const fmtUSD = n => (n||0).toFixed(2);
  const fmt = n => Math.round(n||0).toLocaleString();
  let allDeposits = [];
  let currentFilter = 'all';

  window.adminLogout = async () => { sessionStorage.removeItem('nexa_admin_logged'); await signOut(auth); window.location.href = 'admin-login.html'; };

  window.filterDeposits = (filter, btn) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderDeposits();
  };

  // ── ZOOM RECEIPT ──
  window.toggleZoom = (container) => {
    container.classList.toggle('zoomed');
  };

  // ── VIEW FULL DETAILS WITH RECEIPT ──
  window.viewDepositDetails = (dep) => {
    const modal = document.getElementById('detailModalContent');
    const date = dep.createdAt?.toMillis ? new Date(dep.createdAt.toMillis()).toLocaleString('en-US', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '—';
    const hasReceipt = dep.receiptImage && dep.receiptImage.length > 100;

    modal.innerHTML = `
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M12 18V6"/></svg>Deposit Details</h3>
      
      <div class="info-grid">
        <div class="info-item"><div class="l">User Email</div><div class="v">${dep.userEmail||'—'}</div></div>
        <div class="info-item"><div class="l">User ID</div><div class="v" style="font-size:0.7rem;font-family:monospace;">${dep.userId||'—'}</div></div>
        <div class="info-item"><div class="l">Amount (USDT)</div><div class="v" style="color:var(--success);">$${fmtUSD(dep.amount)}</div></div>
        <div class="info-item"><div class="l">Naira Equivalent</div><div class="v">₦${fmt(dep.amountNaira||(dep.amount*1370))}</div></div>
        <div class="info-item"><div class="l">Currency</div><div class="v">${dep.currency||'USDT'}</div></div>
        <div class="info-item"><div class="l">Exchange Rate</div><div class="v">₦${fmt(dep.usdRate||1370)}/$</div></div>
        <div class="info-item"><div class="l">Payer Name</div><div class="v">${dep.payerName||'—'}</div></div>
        <div class="info-item"><div class="l">Payer Phone</div><div class="v">${dep.payerPhone||'—'}</div></div>
        <div class="info-item"><div class="l">Status</div><div class="v"><span class="status-pill ${dep.status}">${dep.status}</span></div></div>
        <div class="info-item"><div class="l">Submitted At</div><div class="v">${date}</div></div>
        <div class="info-item"><div class="l">Receipt Size</div><div class="v">${dep.receiptSizeKB||'—'} KB</div></div>
      </div>

      <h4 style="margin-bottom:10px;font-size:0.9rem;">📸 Payment Receipt</h4>
      ${hasReceipt ? `
        <div class="receipt-container" id="receiptZoom" onclick="toggleZoom(this)">
          <img src="${dep.receiptImage}" alt="Payment Receipt" />
        </div>
        <div class="receipt-actions">
          <button class="btn view" onclick="toggleZoom(document.getElementById('receiptZoom'))">🔍 Zoom In/Out</button>
          <a href="${dep.receiptImage}" target="_blank" class="btn view" style="text-decoration:none;">🔗 Open Full Size</a>
        </div>
      ` : `
        <div class="no-receipt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><p>No receipt image uploaded</p></div>
      `}

      ${dep.status === 'pending' ? `
        <div class="modal-actions">
          <button class="modal-btn ghost" onclick="closeDetailModal()">Close</button>
          <button class="modal-btn success" onclick="approveDeposit('${dep.id}','${dep.userId}',${dep.amount})">✅ Approve & Credit Wallet</button>
          <button class="modal-btn danger" onclick="rejectDeposit('${dep.id}')">❌ Reject</button>
        </div>
      ` : `
        <div class="modal-actions"><button class="modal-btn primary" onclick="closeDetailModal()">Close</button></div>
      `}
    `;
    document.getElementById('detailModal').classList.add('show');
  };

  window.closeDetailModal = () => document.getElementById('detailModal').classList.remove('show');

  // ── APPROVE DEPOSIT ──
  window.approveDeposit = async (depId, userId, amount) => {
    if (!confirm(`Approve $${fmtUSD(amount)} deposit and credit user wallet?`)) return;
    try {
      await updateDoc(doc(db, 'deposits', depId), { status: 'approved', approvedAt: serverTimestamp() });
      await updateDoc(doc(db, 'users', userId), { walletBalance: increment(amount) });
      alert('✅ Deposit approved! User wallet has been credited with $' + fmtUSD(amount) + ' USDT.');
      closeDetailModal();
      loadDeposits();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  // ── REJECT DEPOSIT ──
  window.rejectDeposit = async (depId) => {
    if (!confirm('Reject this deposit? The user will NOT be credited.')) return;
    try {
      await updateDoc(doc(db, 'deposits', depId), { status: 'rejected' });
      alert('❌ Deposit rejected.');
      closeDetailModal();
      loadDeposits();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  function renderDeposits() {
    let filtered = allDeposits;
    if (currentFilter === 'pending') filtered = allDeposits.filter(d => d.status === 'pending');
    else if (currentFilter === 'approved') filtered = allDeposits.filter(d => d.status === 'approved');
    else if (currentFilter === 'rejected') filtered = allDeposits.filter(d => d.status === 'rejected');

    document.getElementById('depCount').textContent = filtered.length + ' deposits';

    let html = '<table><tr><th>User</th><th>Amount</th><th>Naira</th><th>Payer Info</th><th>Receipt</th><th>Status</th><th>Date</th><th>Actions</th></tr>';
    if (filtered.length === 0) html += '<tr><td colspan="8"><div class="empty"><p>No deposits found</p></div></td></tr>';

    filtered.forEach(dep => {
      const date = dep.createdAt?.toMillis ? new Date(dep.createdAt.toMillis()).toLocaleString('en-US', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
      const hasReceipt = dep.receiptImage && dep.receiptImage.length > 100;

      html += `<tr>
        <td><strong>${dep.userEmail||'—'}</strong><br><small style="color:var(--muted);">${(dep.userId||'').substring(0,8)}...</small></td>
        <td style="font-weight:700;">$${fmtUSD(dep.amount)}</td>
        <td>₦${fmt(dep.amountNaira||(dep.amount*1370))}</td>
        <td><strong>${dep.payerName||'—'}</strong><br><small>${dep.payerPhone||'—'}</small></td>
        <td>${hasReceipt ? '<span style="color:var(--success);">📸 Available</span>' : '<span style="color:var(--muted);">—</span>'}</td>
        <td><span class="status-pill ${dep.status}">${dep.status}</span></td>
        <td>${date}</td>
        <td>
          <button class="btn view" onclick="viewDepositDetails(${JSON.stringify(dep).replace(/"/g,'&quot;').replace(/\\/g,'\\\\')})">📋 View</button>
          ${dep.status==='pending'?`<button class="btn approve" onclick="approveDeposit('${dep.id}','${dep.userId}',${dep.amount})">✓</button><button class="btn reject" onclick="rejectDeposit('${dep.id}')">✗</button>`:''}
        </td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('depositsTable').innerHTML = html;
  }

  async function loadDeposits() {
    try {
      const snap = await getDocs(query(collection(db, 'deposits'), orderBy('createdAt', 'desc')));
      allDeposits = [];
      snap.forEach(d => { allDeposits.push({ id: d.id, ...d.data() }); });
      renderDeposits();
    } catch (err) {
      document.getElementById('depositsTable').innerHTML = '<div class="empty"><p>Error loading deposits. Please refresh.</p></div>';
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user || !sessionStorage.getItem('nexa_admin_logged')) { window.location.href = 'admin-login.html'; return; }
    await loadDeposits();
  });
</script>
</body>
</html>
